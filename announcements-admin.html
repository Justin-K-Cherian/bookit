<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements - Admin</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getAuth, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
    getFirestore 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "Your-API-KEY",
  authDomain: "AUTHDOMAIN",
  projectId: "PROJECT ID",
  storageBucket: "PROJECT ID.appspot.com",
  messagingSenderId: "MESSAGE SENDER ID",
  appId: "1:MESSAGE SENDER ID:APP ID"
};

const app = initializeApp(firebaseConfig);
window.auth = getAuth(app);
window.db = getFirestore(app);
</script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

<style>
:root {
  --g900:#052e16;--g800:#064e3b;--g700:#065f46;--g600:#047857;
  --g500:#059669;--g400:#10b981;--g300:#34d399;--g200:#6ee7b7;
  --g100:#a7f3d0;--g50:#d1fae5;--g25:#ecfdf5;
  --w:#fff;
  --s900:#0f172a;--s800:#1e293b;--s700:#334155;--s600:#475569;
  --s500:#64748b;--s400:#94a3b8;--s300:#cbd5e1;--s200:#e2e8f0;
  --s100:#f1f5f9;--s50:#f8fafc;
  --r500:#ef4444;--r100:#fee2e2;--r50:#fef2f2;
  --amber:#d97706;--amber-l:#fde68a;--amber-ll:#fffbeb;
  --blue:#2563eb;--blue-l:#dbeafe;--blue-ll:#eff6ff;
  --fh:'Lora',serif;--fb:'Plus Jakarta Sans',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:18px;}
body{font-family:var(--fb);background:var(--g25);color:var(--s800);min-height:100vh;}

/* TOPBAR */
.topbar{background:var(--g800);border-bottom:3px solid var(--g600);padding:0 44px;height:72px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(6,78,59,.35);}
.tl{display:flex;align-items:center;gap:14px;}
.bi{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,var(--g400),var(--g700));
  display:flex;align-items:center;justify-content:center;font-size:22px;
  border:2px solid rgba(255,255,255,.2);box-shadow:0 2px 10px rgba(0,0,0,.3);}
.bn{font-family:var(--fh);font-size:20px;font-weight:700;color:var(--w);}
.bst{font-size:11.5px;font-weight:600;color:var(--g300);letter-spacing:.07em;text-transform:uppercase;}
.tdiv{width:1px;height:36px;background:rgba(255,255,255,.15);margin:0 4px;}
.portal-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  color:var(--g300);font-size:13px;font-weight:700;padding:6px 16px;border-radius:20px;letter-spacing:.04em;}
.tr-empty{flex:1;}
.logout-pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);
  padding:9px 18px;border-radius:9px;font-family:var(--fb);font-size:14px;font-weight:700;
  cursor:pointer;transition:all .18s;}
.logout-pill:hover{background:var(--r500);border-color:var(--r500);color:white;}

/* MAIN */
.wrap{max-width:960px;margin:0 auto;padding:44px 28px 80px;}

/* BREADCRUMB */
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--g600);
  margin-bottom:22px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.cs{color:var(--g300);}
.cc{color:var(--g800);font-weight:800;}

/* BACK BUTTON */
.back-btn{display:inline-flex;align-items:center;gap:8px;margin-top:32px;
  background:var(--w);border:2px solid var(--g100);color:var(--g700);
  padding:10px 20px;border-radius:9px;font-family:var(--fb);font-size:15px;font-weight:700;
  cursor:pointer;transition:all .16s;}
.back-btn:hover{border-color:var(--g500);background:var(--g25);color:var(--g800);}

/* PAGE HEADER */
.page-header{background:linear-gradient(135deg,var(--g900),var(--g700),var(--g500));
  border-radius:14px;padding:30px 34px;margin-bottom:28px;
  display:flex;align-items:center;gap:18px;
  box-shadow:0 6px 22px rgba(6,78,59,.28);animation:fu .4s ease both;
  position:relative;overflow:hidden;}
.page-header::before{content:'';position:absolute;right:-40px;top:-40px;
  width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);}
.ph-icon{font-size:44px;position:relative;z-index:1;}
.ph-text h1{font-family:var(--fh);font-size:26px;font-weight:700;color:white;margin-bottom:5px;}
.ph-text p{font-size:15px;color:rgba(255,255,255,.78);font-weight:500;}

/* SECTION LABEL */
.sec-label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--g600);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,var(--g100),transparent);}

/* FORM SECTION */
.form-section{background:var(--w);border:2px solid var(--g50);border-radius:14px;
  padding:30px 28px;margin-bottom:28px;box-shadow:0 2px 8px rgba(6,78,59,.07);
  animation:fu .4s .05s ease both;}

.form-group{margin-bottom:20px;}
.form-group label{display:block;color:var(--g700);font-weight:800;margin-bottom:8px;
  font-size:14px;text-transform:uppercase;letter-spacing:.06em;}
.form-group input,
.form-group textarea,
.form-group select{width:100%;padding:13px 16px;border:2px solid var(--g50);
  background:var(--g25);border-radius:10px;font-family:var(--fb);
  font-size:15px;font-weight:500;color:var(--s800);outline:none;transition:all .18s;}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{border-color:var(--g400);box-shadow:0 0 0 3px rgba(16,185,129,.14);background:var(--w);}
.form-group input::placeholder,
.form-group textarea::placeholder{color:var(--s400);}
.form-group textarea{min-height:110px;resize:vertical;}
.form-group select{cursor:pointer;}
.form-group select option{background:var(--w);color:var(--s800);}

/* PRIORITY BUTTONS */
.priority-group{display:flex;gap:12px;flex-wrap:wrap;}
.priority-btn{flex:1;min-width:120px;padding:12px 16px;
  border:2px solid var(--g50);background:var(--g25);color:var(--s600);
  border-radius:10px;cursor:pointer;font-family:var(--fb);font-size:14px;font-weight:700;
  transition:all .18s;text-align:center;}
.priority-btn:hover{background:var(--g50);color:var(--g800);}
.priority-btn.active{background:linear-gradient(135deg,var(--g500),var(--g700));
  border-color:var(--g600);color:white;box-shadow:0 3px 10px rgba(6,78,59,.25);}
.priority-btn.active.high{background:linear-gradient(135deg,var(--r500),#dc2626);
  border-color:var(--r500);box-shadow:0 3px 10px rgba(239,68,68,.25);}
.priority-btn.active.medium{background:linear-gradient(135deg,var(--amber),#b45309);
  border-color:var(--amber);box-shadow:0 3px 10px rgba(217,119,6,.25);}

/* SUBMIT BUTTON */
.submit-btn{width:100%;padding:15px;margin-top:8px;
  background:linear-gradient(135deg,var(--g500),var(--g800));color:white;
  border:none;border-radius:11px;font-family:var(--fb);font-size:16px;font-weight:800;
  cursor:pointer;transition:all .18s;letter-spacing:.03em;
  box-shadow:0 4px 14px rgba(6,78,59,.3);}
.submit-btn:hover{background:linear-gradient(135deg,var(--g600),var(--g900));
  transform:translateY(-2px);box-shadow:0 6px 20px rgba(6,78,59,.4);}

/* ANNOUNCEMENTS LIST */
.announcements-list{background:var(--w);border:2px solid var(--g50);border-radius:14px;
  padding:28px;box-shadow:0 2px 8px rgba(6,78,59,.07);animation:fu .4s .1s ease both;}

/* ANNOUNCEMENT CARDS */
.announcement-card{background:var(--g25);border:2px solid var(--g50);
  border-radius:12px;padding:20px 22px;margin-bottom:12px;
  transition:all .18s;border-left:5px solid;}
.announcement-card.high  {border-left-color:var(--r500);background:var(--r50);}
.announcement-card.medium{border-left-color:var(--amber);background:var(--amber-ll);}
.announcement-card.low   {border-left-color:var(--g500);background:var(--g25);}
.announcement-card:hover{transform:translateX(4px);box-shadow:0 4px 14px rgba(6,78,59,.1);}

.announcement-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.announcement-title{color:var(--s900);font-size:18px;font-weight:800;flex:1;line-height:1.3;}
.priority-badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;margin-left:12px;}
.priority-badge.high  {background:var(--r500);color:white;}
.priority-badge.medium{background:var(--amber);color:white;}
.priority-badge.low   {background:var(--g500);color:white;}

.announcement-message{color:var(--s700);font-size:15px;line-height:1.65;margin-bottom:12px;font-weight:500;}
.announcement-meta{display:flex;justify-content:space-between;align-items:center;
  color:var(--s500);font-size:13px;margin-bottom:12px;font-weight:500;}

/* ACTION BUTTONS */
.delete-btn{background:var(--r50);border:2px solid var(--r100);color:var(--r500);
  padding:8px 16px;border-radius:8px;font-family:var(--fb);font-size:13px;font-weight:700;
  cursor:pointer;transition:all .16s;}
.delete-btn:hover{background:var(--r500);color:white;border-color:var(--r500);}

.dismiss-btn{background:var(--w);border:2px solid var(--g100);color:var(--g700);
  padding:8px 16px;border-radius:8px;font-family:var(--fb);font-size:13px;font-weight:700;
  cursor:pointer;transition:all .16s;}
.dismiss-btn:hover{background:var(--g25);border-color:var(--g400);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:52px 20px;
  border:2px dashed var(--g100);border-radius:12px;}
.empty-state h3{font-family:var(--fh);font-size:20px;font-weight:700;color:var(--g700);margin-bottom:7px;}
.empty-state p{color:var(--s500);font-size:15px;}

/* TOAST */
.toast{position:fixed;bottom:26px;right:26px;z-index:9999;display:none;
  background:var(--g800);color:white;padding:14px 22px;border-radius:10px;
  font-family:var(--fb);font-size:15px;font-weight:700;
  box-shadow:0 8px 28px rgba(6,78,59,.35);
  border-left:4px solid var(--g300);animation:st .3s ease both;}
.toast.error{background:var(--r500);border-left-color:#fca5a5;}

.hidden{display:none!important;}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes st{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--g25);}
::-webkit-scrollbar-thumb{background:var(--g200);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--g400);}
@media(max-width:768px){.topbar{padding:0 18px;}.wrap{padding:28px 16px 60px;}.priority-group{flex-direction:column;}.priority-btn{min-width:100%;}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tl">
    <div class="bi">📢</div>
    <div><div class="bn">BookIt</div><div class="bst">Facility Management</div></div>
    <div class="tdiv"></div>
    <span class="portal-pill">📢 Announcements Manager</span>
  </div>
  <div class="tr-empty"></div>
</div>

<div class="wrap">

  <div class="page-header">
    <div class="ph-icon">📢</div>
    <div class="ph-text">
      <h1>Announcements Manager</h1>
      <p>Create and manage announcements visible to all BookIt users.</p>
    </div>
  </div>

  <!-- CREATE FORM -->
  <div class="sec-label">✨ Create New Announcement</div>
  <div class="form-section">

    <div class="form-group">
      <label>📝 Title</label>
      <input type="text" id="announcementTitle" placeholder="e.g., Maintenance Notice, New Feature…">
    </div>

    <div class="form-group">
      <label>💬 Message</label>
      <textarea id="announcementMessage" placeholder="Enter your announcement message here…"></textarea>
    </div>

    <div class="form-group">
      <label>⏰ Expires In</label>
      <select id="expiryDuration">
        <option value="1">1 Hour</option>
        <option value="3">3 Hours</option>
        <option value="6">6 Hours</option>
        <option value="12">12 Hours</option>
        <option value="24" selected>24 Hours</option>
        <option value="48">48 Hours</option>
        <option value="72">72 Hours</option>
      </select>
    </div>

    <div class="form-group">
      <label>⚡ Priority Level</label>
      <div class="priority-group">
        <button class="priority-btn" data-priority="low" onclick="selectPriority('low')">🟢 Low Priority</button>
        <button class="priority-btn active medium" data-priority="medium" onclick="selectPriority('medium')">🟡 Medium Priority</button>
        <button class="priority-btn high" data-priority="high" onclick="selectPriority('high')">🔴 High Priority</button>
      </div>
    </div>

    <button class="submit-btn" onclick="createAnnouncement()">🚀 Publish Announcement</button>
  </div>

  <!-- ACTIVE LIST -->
  <div class="sec-label">📋 Active Announcements</div>
  <div class="announcements-list">
    <div id="announcementsContainer"></div>
  </div>

  <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>

</div>

<!-- USER-FACING BANNER (kept for script compatibility) -->
<div id="announcementsBanner"></div>

<div class="toast" id="toast"></div>

<script type="module">
import { onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
    collection, addDoc, query, where, getDocs,
    deleteDoc, doc, getDoc, updateDoc, arrayUnion
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentUser      = null;
let currentRole      = null;
let selectedPriority = 'medium';

// ─── AUTH LISTENER ────────────────────────────────────────────────────────────
// Fires on EVERY login and logout — including when a different user logs in
// on the same device. Wiping state + DOM here is the core fix.
onAuthStateChanged(auth, async (user) => {

    // ✅ Step 1: Always reset everything first, regardless of who logged in.
    // This ensures user B never inherits user A's in-memory state or DOM.
    currentUser = null;
    currentRole = null;
    document.getElementById('announcementsContainer').innerHTML = '';
    document.getElementById('announcementsBanner').innerHTML    = '';

    if (!user) {
        location.href = 'index.html';
        return;
    }

    // ✅ Step 2: Assign the new user and load their data from Firestore.
    currentUser = user;

    try {
        const userSnap = await getDoc(doc(db, 'users', user.uid));
        if (userSnap.exists()) {
            currentRole = userSnap.data().role;
        }
    } catch (e) {
        console.error('Failed to fetch user role:', e);
    }

    // ✅ Step 3: Load both lists scoped entirely to this user's UID.
    await loadAnnouncements();
    await loadAnnouncementsBanner();
});

// ─── PRIORITY SELECTION ───────────────────────────────────────────────────────
window.selectPriority = function (priority) {
    selectedPriority = priority;
    document.querySelectorAll('.priority-btn').forEach(btn => btn.classList.remove('active'));
    const btn = document.querySelector(`[data-priority="${priority}"]`);
    if (btn) btn.classList.add('active');
};

// ─── CREATE ANNOUNCEMENT ──────────────────────────────────────────────────────
window.createAnnouncement = async function () {
    const title       = document.getElementById('announcementTitle').value.trim();
    const message     = document.getElementById('announcementMessage').value.trim();
    const expiryHours = parseInt(document.getElementById('expiryDuration').value);

    if (!title || !message) {
        showToast('Please fill in all fields', true);
        return;
    }

    const now        = new Date();
    const expiryDate = new Date(now.getTime() + expiryHours * 60 * 60 * 1000);

    try {
        await addDoc(collection(db, 'announcements'), {
            title:     title,
            message:   message,
            priority:  selectedPriority,
            createdBy: currentUser.email,
            createdAt: now.toISOString(),
            expiresAt: expiryDate.toISOString(),
            role:      currentRole,
            active:    true
        });

        showToast('✅ Announcement published successfully!');
        document.getElementById('announcementTitle').value   = '';
        document.getElementById('announcementMessage').value = '';
        document.getElementById('expiryDuration').value      = '24';

        await loadAnnouncements();
        await loadAnnouncementsBanner();
    } catch (error) {
        showToast('Error creating announcement: ' + error.message, true);
    }
};

// ─── LOAD ADMIN MANAGEMENT LIST ───────────────────────────────────────────────
async function loadAnnouncements() {
    const container = document.getElementById('announcementsContainer');
    container.innerHTML = '';

    try {
        const now      = new Date().toISOString();
        const snapshot = await getDocs(query(
            collection(db, 'announcements'),
            where('expiresAt', '>', now)
        ));

        if (snapshot.empty) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>No Active Announcements</h3>
                    <p>Create your first announcement above.</p>
                </div>`;
            return;
        }

        const priorityOrder = { high: 0, medium: 1, low: 2 };
        const docs = [];
        snapshot.forEach(d => docs.push({ id: d.id, data: d.data() }));
        docs.sort((a, b) =>
            (priorityOrder[a.data.priority] ?? 3) - (priorityOrder[b.data.priority] ?? 3)
        );

        docs.forEach(({ id, data }) => container.appendChild(createAdminCard(id, data)));

    } catch (error) {
        console.error('Error loading announcements:', error.message);
    }
}

// ─── LOAD USER-FACING BANNER ──────────────────────────────────────────────────
// Reads dismissedAnnouncements fresh from Firestore using currentUser.uid
// every single time — guarantees the correct dismissed list per user per device.
async function loadAnnouncementsBanner() {
    const banner = document.getElementById('announcementsBanner');
    banner.innerHTML = '';  // ✅ always wipe before rebuild

    if (!currentUser) return;

    try {
        const now      = new Date().toISOString();
        const snapshot = await getDocs(query(
            collection(db, 'announcements'),
            where('expiresAt', '>', now)
        ));

        if (snapshot.empty) return;

        // ✅ Fresh Firestore read — keyed to currentUser.uid.
        // No localStorage, no cached variable. Different users = different docs.
        const userSnap  = await getDoc(doc(db, 'users', currentUser.uid));
        const dismissed = userSnap.exists()
            ? (userSnap.data().dismissedAnnouncements || [])
            : [];

        const priorityOrder = { high: 0, medium: 1, low: 2 };
        const docs = [];
        snapshot.forEach(d => docs.push({ id: d.id, data: d.data() }));
        docs.sort((a, b) =>
            (priorityOrder[a.data.priority] ?? 3) - (priorityOrder[b.data.priority] ?? 3)
        );

        docs.forEach(({ id, data }) => {
            if (dismissed.includes(id)) return;  // ✅ only skip THIS user's dismissals
            banner.appendChild(createBannerItem(id, data));
        });

    } catch (error) {
        console.error('Error loading announcements banner:', error.message);
    }
}

// ─── CREATE BANNER ITEM ───────────────────────────────────────────────────────
function createBannerItem(id, data) {
    const icons = { high: '🚨', medium: '📢', low: 'ℹ️' };
    const item  = document.createElement('div');
    item.className = `announcement-card ${data.priority}`;
    item.id        = `banner-${id}`;

    item.innerHTML = `
        <div class="announcement-header">
            <div class="announcement-title">${icons[data.priority] || '📣'} ${data.title}</div>
            <span class="priority-badge ${data.priority}">${data.priority}</span>
        </div>
        <div class="announcement-message">${data.message}</div>
        <button class="dismiss-btn" onclick="dismissAnnouncement('${id}')">✕ Dismiss</button>
    `;

    return item;
}

// ─── DISMISS ANNOUNCEMENT ─────────────────────────────────────────────────────
// Writes to Firestore under users/{currentUser.uid}/dismissedAnnouncements.
// User A's dismissals are stored in user A's doc.
// User B's dismissals are stored in user B's doc.
// They never overlap, even on the same device.
window.dismissAnnouncement = async function (id) {
    if (!currentUser) return;

    try {
        await updateDoc(doc(db, 'users', currentUser.uid), {
            dismissedAnnouncements: arrayUnion(id)   // safe, no duplicates
        });
    } catch (e) {
        console.error('Failed to save dismissal:', e);
        // Still animate out so UX isn't broken if Firestore write fails
    }

    const item = document.getElementById(`banner-${id}`);
    if (item) {
        item.style.animation = 'slideUp 0.4s ease forwards';
        setTimeout(() => item.remove(), 400);
    }
};

// ─── CREATE ADMIN CARD ────────────────────────────────────────────────────────
function createAdminCard(id, data) {
    const card        = document.createElement('div');
    card.className    = `announcement-card ${data.priority}`;

    const expiryDate  = new Date(data.expiresAt);
    const createdDate = new Date(data.createdAt);
    const hoursLeft   = Math.ceil((expiryDate - new Date()) / (1000 * 60 * 60));

    card.innerHTML = `
        <div class="announcement-header">
            <div class="announcement-title">${data.title}</div>
            <span class="priority-badge ${data.priority}">${data.priority}</span>
        </div>
        <div class="announcement-message">${data.message}</div>
        <div class="announcement-meta">
            <span>Created: ${createdDate.toLocaleDateString()}</span>
            <span>Expires in: ${hoursLeft} hour${hoursLeft !== 1 ? 's' : ''}</span>
        </div>
        <button class="delete-btn" onclick="deleteAnnouncement('${id}')">🗑️ Delete</button>
    `;

    return card;
}

// ─── DELETE ANNOUNCEMENT ──────────────────────────────────────────────────────
window.deleteAnnouncement = async function (id) {
    if (!confirm('Are you sure you want to delete this announcement?')) return;

    try {
        await deleteDoc(doc(db, 'announcements', id));
        showToast('Announcement deleted');
        await loadAnnouncements();
        await loadAnnouncementsBanner();
    } catch (error) {
        showToast('Error deleting: ' + error.message, true);
    }
};

// ─── SHOW TOAST ───────────────────────────────────────────────────────────────
function showToast(message, isError = false) {
    const toast         = document.getElementById('toast');
    toast.textContent   = message;
    toast.className     = isError ? 'toast error' : 'toast';
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

// ─── GO BACK ──────────────────────────────────────────────────────────────────
window.goBack = function () {
    if (currentRole === 'admin')       location.href = 'admin.html';
    else if (currentRole === 'sadmin') location.href = 'sportsadmin.html';
    else                               location.href = 'index.html';
};
</script>
