<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Teams – BookIt</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Outfit:wght@200;300;400;500;600&family=Anton&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --primary:      #19304D;
  --primary-mid:  #1f3c5e;
  --primary-lt:   #274d78;
  --primary-deep: #0f1f30;
  --white:        #ffffff;
  --on-card:      rgba(255,255,255,0.88);
  --on-card-mid:  rgba(255,255,255,0.50);
  --on-card-soft: rgba(255,255,255,0.26);

  /* Gold system — matches findmyteam */
  --gold:         #c9a96e;
  --gold-lt:      #e8cfa0;
  --gold-deep:    #a07840;
  --gold-dim:     rgba(201,169,110,0.13);
  --gold-border:  rgba(201,169,110,0.30);

  /* Card surfaces */
  --card-bg:      rgba(255,255,255,0.04);
  --card-border:  rgba(255,255,255,0.09);
  --card-hover:   rgba(255,255,255,0.07);
  --ci-bg:        rgba(255,255,255,0.045);
  --ci-border:    rgba(255,255,255,0.08);
  --ci-text:      rgba(255,255,255,0.60);
  --ci-text-soft: rgba(255,255,255,0.32);

  /* Status colours */
  --approved:  #3ecf8e;
  --cancelled: #f05454;
  --rejected:  #f4a53a;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { min-height:100vh; font-family:'Outfit',sans-serif; overflow-x:hidden; color:var(--on-card); }

/* ══════════════════════════════════════
   BACKGROUND — identical to findmyteam
══════════════════════════════════════ */
.bg {
  position:fixed; inset:0; z-index:0;
  background:#19304D;
  overflow:hidden;
}
.bg-depth {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 90% 80% at 0% 0%,   rgba(31,60,94,0.70) 0%, transparent 55%),
    radial-gradient(ellipse 70% 60% at 100% 100%, rgba(10,18,28,0.80) 0%, transparent 55%),
    radial-gradient(ellipse 55% 55% at 50% 50%,  rgba(25,48,77,0.20) 0%, transparent 70%);
}
.stripes {
  position:absolute; inset:-60% -20%;
  width:140%; height:220%;
  transform:rotate(-28deg);
  pointer-events:none;
}
.stripe { position:absolute; top:0; bottom:0; }
.stripe-1 { left:14%;  width:7%;  background:rgba(255,255,255,0.038); }
.stripe-2 { left:25%;  width:11%; background:rgba(255,255,255,0.028); }
.stripe-3 { left:41%;  width:5%;  background:rgba(255,255,255,0.048); }
.stripe-4 { left:55%;  width:2%;  background:rgba(255,255,255,0.025); }
.stripe-5 { left:63%;  width:6%;  background:rgba(255,255,255,0.020); }
.stripe-6 { left:75%;  width:3%;  background:rgba(255,255,255,0.032); }
.stripe-edge {
  position:absolute; top:0; bottom:0; left:22%; width:1.5px;
  background:linear-gradient(180deg,
    transparent 0%, rgba(255,255,255,0.22) 15%,
    rgba(255,255,255,0.28) 40%, rgba(255,255,255,0.22) 65%, transparent 100%);
}
.bg-hlines {
  position:absolute; inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
  background-size:100% 180px; background-position:0 90px;
}
.bg-grain {
  position:absolute; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.80' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size:220px; opacity:0.55; pointer-events:none;
}
.bg-vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse 110% 110% at 50% 50%,transparent 45%,rgba(6,12,22,0.65) 100%);
}

.top-stripe { position:fixed;top:0;left:0;right:0;z-index:300;height:2px;
  background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-lt),var(--gold)); }
.bot-strip { position:fixed;bottom:0;left:0;right:0;z-index:300;height:2px;
  background:linear-gradient(90deg,var(--primary-lt),var(--primary-mid),var(--gold-deep)); }

/* ══════════════════════════════════════
   TOPBAR — matches findmyteam exactly
══════════════════════════════════════ */
.topbar {
  position:sticky; top:2px; z-index:200;
  display:flex; align-items:center; justify-content:space-between;
  height:66px; padding:0 40px;
  background:rgba(15,31,48,0.88);
  border-bottom:1px solid rgba(201,169,110,0.12);
  backdrop-filter:blur(20px);
  box-shadow:0 4px 32px rgba(0,0,0,0.28);
}
.topbar::before {
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--gold),var(--gold-deep));
}
.topbar-left { display:flex; align-items:center; gap:24px; }
.topbar-right { display:flex; align-items:center; gap:12px; }

.back-btn {
  display:flex; align-items:center; gap:8px;
  background:transparent;
  border:1px solid rgba(201,169,110,0.28);
  padding:9px 18px; cursor:pointer;
  font-family:'DM Mono',monospace; font-size:9px; font-weight:500;
  letter-spacing:2.5px; text-transform:uppercase;
  color:var(--gold); transition:all .28s ease;
  position:relative; overflow:hidden;
}
.back-btn::before { content:''; position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(201,169,110,0.14),transparent);
  transform:translateX(-100%); transition:transform .4s ease; }
.back-btn:hover::before { transform:translateX(100%); }
.back-btn:hover { background:rgba(201,169,110,0.14); border-color:rgba(201,169,110,0.45); color:var(--gold-lt); }
.back-arrow { font-size:14px; transition:transform .22s; display:inline-block; }
.back-btn:hover .back-arrow { transform:translateX(-3px); }

.topbar-vr { width:1px; height:28px; background:rgba(255,255,255,0.10); flex-shrink:0; }

.topbar-heading { display:flex; flex-direction:column; gap:3px; }
.topbar-eyebrow {
  font-family:'DM Mono',monospace;
  font-size:8px; font-weight:500; letter-spacing:4px; text-transform:uppercase;
  color:var(--on-card-soft); line-height:1;
}
.topbar-title {
  font-family:'Cormorant Garamond',serif;
  font-size:22px; font-weight:400; font-style:italic;
  color:var(--white); letter-spacing:-0.3px; line-height:1;
  display:flex; align-items:center; gap:12px;
}
.title-badge {
  font-family:'DM Mono',monospace;
  font-style:normal; font-size:8px; font-weight:500;
  letter-spacing:3px; text-transform:uppercase;
  color:var(--gold);
  border:1px solid var(--gold-border);
  padding:3px 10px;
  background:var(--gold-dim);
}

/* ══════════════════════════════════════
   PAGE HEADER
══════════════════════════════════════ */
.page-header {
  position:relative; z-index:10;
  width:100%; max-width:1180px; margin:0 auto;
  padding:36px 48px 0;
}
.page-header-inner {
  position:relative;
  padding:28px 0 22px;
  border-top:1px solid rgba(255,255,255,0.08);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.page-header-inner::before,
.page-header-inner::after {
  content:''; position:absolute;
  width:16px; height:16px;
  border-style:solid; border-color:rgba(201,169,110,0.25);
}
.page-header-inner::before { top:-1px; left:0;  border-width:1px 0 0 1px; }
.page-header-inner::after  { top:-1px; right:0; border-width:1px 1px 0 0; }
.corner-bl { position:absolute; bottom:-1px; left:0;  width:16px; height:16px; border:solid rgba(201,169,110,0.25); border-width:0 0 1px 1px; }
.corner-br { position:absolute; bottom:-1px; right:0; width:16px; height:16px; border:solid rgba(201,169,110,0.25); border-width:0 1px 1px 0; }

.page-eyebrow {
  font-family:'DM Mono',monospace;
  font-size:8px; font-weight:500; letter-spacing:5px; text-transform:uppercase;
  color:var(--on-card-soft); margin-bottom:12px;
}
.page-title-row { display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; }
.page-title {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(40px,5vw,60px);
  font-weight:300; font-style:italic;
  color:var(--white); letter-spacing:-1.5px; line-height:0.9;
}
.page-title-accent { color:var(--gold); font-style:normal; }
.page-title-sub {
  font-family:'DM Mono',monospace;
  font-size:9px; font-weight:400; letter-spacing:3px;
  color:var(--on-card-soft); text-transform:uppercase;
  padding-bottom:4px;
}

/* ══════════════════════════════════════
   CONTAINER
══════════════════════════════════════ */
.container {
  max-width:1180px; margin:0 auto;
  padding:40px 48px 120px;
  position:relative; z-index:10;
}

/* ══════════════════════════════════════
   SECTION LABEL
══════════════════════════════════════ */
.section-label {
  font-family:'DM Mono',monospace; font-size:9px; letter-spacing:5px; text-transform:uppercase;
  color:var(--on-card-mid); margin-bottom:22px; display:flex; align-items:center; gap:12px;
}
.section-label::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.14); }

/* ══════════════════════════════════════
   TABS
══════════════════════════════════════ */
.tabs {
  display:flex; width:fit-content;
  margin:0 0 36px;
  border:1px solid rgba(255,255,255,0.10);
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(14px);
  overflow:hidden;
  box-shadow:0 2px 0 var(--gold), 0 4px 20px rgba(0,0,0,0.20);
}
.tab {
  padding:12px 40px;
  background:transparent; border:none;
  font-family:'DM Mono',monospace;
  font-size:9px; font-weight:500;
  letter-spacing:3px; text-transform:uppercase;
  color:var(--on-card-mid);
  cursor:pointer; transition:all .24s ease;
  position:relative; white-space:nowrap;
}
.tab:not(:last-child) { border-right:1px solid rgba(255,255,255,0.08); }
.tab:hover { background:rgba(255,255,255,0.05); color:var(--on-card); }
.tab.active {
  background:var(--gold-dim);
  color:var(--gold);
  border-bottom:2px solid var(--gold);
}

/* ══════════════════════════════════════
   TAB CONTENT
══════════════════════════════════════ */
.tab-content { display:none; }
.tab-content.active { display:block; }

/* ══════════════════════════════════════
   TEAMS GRID
══════════════════════════════════════ */
.teams-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(420px, 1fr));
  gap:18px;
}

/* ══════════════════════════════════════
   TEAM CARD — dark glass, matches findmyteam
══════════════════════════════════════ */
.team-card {
  position:relative; overflow:hidden;
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-left:3px solid rgba(201,169,110,0.45);
  backdrop-filter:blur(14px);
  animation:cardIn .42s cubic-bezier(.16,1,.3,1) both;
  transition:all .34s cubic-bezier(.16,1,.3,1);
  box-shadow:0 4px 24px rgba(0,0,0,0.28);
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}
.team-card::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:2px; z-index:2;
  background:linear-gradient(90deg,transparent,var(--gold-deep),var(--gold),var(--gold-deep),transparent);
  opacity:0; transition:opacity .28s;
}
.team-card:hover::before { opacity:1; }
.team-card-shimmer {
  position:absolute; inset:0; pointer-events:none; z-index:1;
  background:linear-gradient(108deg,transparent 32%,rgba(255,255,255,0.04) 50%,transparent 68%);
  transform:translateX(-130%); transition:transform .65s ease;
}
.team-card:hover .team-card-shimmer { transform:translateX(130%); }
.team-card:hover {
  background:var(--card-hover);
  border-color:rgba(255,255,255,0.14);
  border-left-color:var(--gold);
  transform:translate(-3px,-3px);
  box-shadow:6px 6px 0 rgba(0,0,0,0.35), 0 8px 32px rgba(0,0,0,0.30);
}

/* ── CARD HEADER ── */
.card-header {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 18px 12px 18px;
  background:rgba(255,255,255,0.04);
  border-bottom:1px solid rgba(255,255,255,0.07);
  position:relative; z-index:2;
}
.activity-badge {
  font-family:'DM Mono',monospace;
  font-size:9px; font-weight:600;
  letter-spacing:2.5px; text-transform:uppercase;
  color:var(--gold);
  background:var(--gold-dim);
  border:1px solid var(--gold-border);
  padding:6px 14px;
  animation:badgePulse 3.5s ease-in-out infinite;
}
@keyframes badgePulse { 0%,100%{opacity:1} 50%{opacity:.70} }

.member-fraction {
  font-family:'DM Mono',monospace;
  font-size:10px; font-weight:600; letter-spacing:1px;
  color:var(--on-card-mid);
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  padding:5px 12px;
}

/* ── CARD BODY ── */
.card-body { padding:16px 18px; position:relative; z-index:2; }

.contact-number {
  display:inline-flex; align-items:center; gap:6px;
  font-family:'DM Mono',monospace;
  font-size:10px; font-weight:500;
  color:var(--ci-text);
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.09);
  padding:5px 12px; margin-bottom:12px;
}

/* ── CREATOR INFO ── */
.creator-info {
  display:flex; align-items:center; gap:12px;
  padding:11px 13px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-left:2px solid var(--gold-border);
  margin-bottom:12px;
}
.creator-avatar {
  width:40px; height:40px; flex-shrink:0;
  background:var(--gold-dim);
  border:1px solid var(--gold-border);
  display:flex; align-items:center; justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:17px; font-weight:400;
  color:var(--gold);
}
.creator-details { flex:1; min-width:0; }
.creator-name {
  font-family:'Outfit',sans-serif;
  font-size:13px; font-weight:600; letter-spacing:.5px;
  color:var(--on-card);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-bottom:2px;
}
.creator-email {
  font-family:'DM Mono',monospace;
  font-size:10px; color:var(--ci-text-soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.creator-phone {
  font-family:'DM Mono',monospace;
  font-size:10px; color:rgba(201,169,110,0.55); margin-top:2px;
}

/* ── INFO GRID ── */
.info-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:8px; margin-bottom:12px;
}
.info-item, .location {
  padding:8px 11px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  font-family:'Outfit',sans-serif;
  font-size:11px; font-weight:500;
  color:var(--ci-text);
  display:flex; align-items:center; gap:6px;
}

/* ── MESSAGE ── */
.message {
  font-family:'Cormorant Garamond',serif;
  font-size:14px; font-style:italic; font-weight:400;
  color:rgba(255,255,255,0.45);
  line-height:1.65; margin-bottom:12px;
  padding:11px 13px;
  background:rgba(255,255,255,0.03);
  border-left:2px solid rgba(201,169,110,0.30);
}

/* ── DATETIME ── */
.datetime {
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;
}
.datetime span {
  font-family:'DM Mono',monospace;
  font-size:9px; font-weight:600; letter-spacing:.5px;
  color:var(--gold);
  background:var(--gold-dim);
  border:1px solid var(--gold-border);
  padding:5px 10px;
  display:flex; align-items:center; gap:5px;
}

/* ── MEMBERS SECTION ── */
.members-section {
  margin-top:12px; padding:13px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-top:2px solid rgba(255,255,255,0.10);
}
.members-title {
  font-family:'DM Mono',monospace;
  font-size:8px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:var(--on-card-soft); margin-bottom:10px;
}
.member-item {
  padding:9px 12px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  border-left:2px solid transparent;
  margin-bottom:6px; transition:all .2s;
}
.member-item:last-child { margin-bottom:0; }
.member-item:hover { border-left-color:var(--gold); background:rgba(255,255,255,0.06); }
.member-name {
  display:flex; align-items:center; gap:8px;
  font-family:'Outfit',sans-serif;
  font-size:11px; font-weight:600; letter-spacing:.5px;
  color:var(--on-card); margin-bottom:3px;
}
.member-details {
  font-family:'DM Mono',monospace;
  font-size:9px; color:var(--ci-text-soft);
  display:flex; gap:12px; flex-wrap:wrap;
}
.member-badge {
  font-family:'DM Mono',monospace;
  font-size:7px; font-weight:600;
  letter-spacing:2px; text-transform:uppercase;
  color:var(--gold);
  background:var(--gold-dim);
  border:1px solid var(--gold-border);
  padding:2px 8px;
}

/* ── REQUESTS SECTION ── */
.requests-section {
  margin-top:12px; padding:13px;
  background:rgba(201,169,110,0.04);
  border:1px solid rgba(201,169,110,0.14);
  border-top:2px solid rgba(201,169,110,0.40);
}
.requests-title {
  font-family:'DM Mono',monospace;
  font-size:8px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:rgba(201,169,110,0.70); margin-bottom:10px;
}
.request-item {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  border-left:3px solid rgba(201,169,110,0.40);
  padding:11px; margin-bottom:8px; transition:border-color .2s;
}
.request-item:last-child { margin-bottom:0; }
.request-item:hover { border-left-color:var(--gold); }
.request-name {
  font-family:'Outfit',sans-serif;
  font-size:11px; font-weight:600; letter-spacing:.5px;
  color:var(--on-card); margin-bottom:4px;
}
.request-contact {
  font-family:'DM Mono',monospace;
  font-size:9px; color:var(--ci-text-soft);
  margin-bottom:8px; display:flex; gap:12px; flex-wrap:wrap;
}
.request-msg {
  font-family:'Cormorant Garamond',serif;
  font-size:13px; font-style:italic;
  color:rgba(255,255,255,0.40);
  line-height:1.6; margin-bottom:10px;
  padding:8px 12px;
  background:rgba(255,255,255,0.03);
  border-left:2px solid rgba(201,169,110,0.25);
}
.request-actions { display:flex; gap:8px; flex-wrap:wrap; }

/* ── CARD FOOTER ── */
.card-footer {
  padding:13px 18px;
  background:rgba(255,255,255,0.025);
  border-top:1px solid rgba(255,255,255,0.07);
  display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;
  position:relative; z-index:2;
}

/* ══════════════════════════════════════
   ACTION BUTTONS
══════════════════════════════════════ */
.btn-accept, .btn-reject, .btn-leave, .btn-delete, .btn-reopen {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 18px;
  font-family:'DM Mono',monospace;
  font-size:9px; font-weight:600;
  letter-spacing:2.5px; text-transform:uppercase;
  cursor:pointer; transition:all .24s ease;
  border:1px solid transparent;
}

.btn-accept {
  background:rgba(62,207,142,0.09);
  color:rgba(62,207,142,0.85);
  border-color:rgba(62,207,142,0.28);
}
.btn-accept:hover {
  background:rgba(62,207,142,0.18);
  border-color:rgba(62,207,142,0.50);
  color:#fff;
  box-shadow:0 4px 18px rgba(62,207,142,0.12);
}

.btn-reject {
  background:rgba(240,84,84,0.07);
  color:rgba(240,120,120,0.82);
  border-color:rgba(240,84,84,0.22);
}
.btn-reject:hover {
  background:rgba(240,84,84,0.16);
  border-color:rgba(240,84,84,0.45);
  color:#fff;
  box-shadow:0 4px 18px rgba(240,84,84,0.12);
}

.btn-leave {
  background:rgba(255,255,255,0.05);
  color:var(--on-card-mid);
  border-color:rgba(255,255,255,0.14);
}
.btn-leave:hover {
  background:rgba(255,255,255,0.10);
  border-color:rgba(255,255,255,0.28);
  color:var(--on-card);
}

.btn-delete {

.modal {

<!-- ══════════════════════════════════
     SCRIPT — COMPLETELY UNTOUCHED
══════════════════════════════════════ -->
<script type="module">
// ══════════════════ FIREBASE INIT ══════════════════
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, getDoc, doc, query, where, updateDoc, deleteDoc, serverTimestamp, increment, arrayUnion, arrayRemove, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey:"Your-API-KEY",
    authDomain:"AUTHDOMAIN",
    projectId:"PROJECT ID",
    storageBucket:"PROJECT ID.appspot.com",
    messagingSenderId:"MESSAGE SENDER ID",
    appId:"1:MESSAGE SENDER ID:APP ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let deleteTeamId = null;

// ══════════════════ AUTH ══════════════════
onAuthStateChanged(auth, user => {
    if (!user) {
        location.href = 'index.html';
        return;
    }
    currentUser = user;
    loadCreatedTeams();
    loadJoinedTeams();
});

// ══════════════════ TABS ══════════════════
window.switchTab = function(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if (tab === 'created') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('createdTab').classList.add('active');
    } else {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('joinedTab').classList.add('active');
    }
}

// ══════════════════ UTILITY FUNCTIONS ══════════════════
function formatDate(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    const options = { month: 'short', day: 'numeric', year: 'numeric' };
    return date.toLocaleDateString('en-US', options);
}

function formatTime(time, ampm) {
    if (!time) return '';
    const [hours, minutes] = time.split(':');
    return `${hours}:${minutes} ${ampm || 'AM'}`;
}

// ══════════════════ LOAD CREATED TEAMS ══════════════════
async function loadCreatedTeams() {
    const container = document.getElementById('createdTeamsContainer');
    
    if (!currentUser) return;
    
    container.innerHTML = '<div class="loading"><div class="spinner"></div><p style="color:rgba(255,255,255,0.30);margin-top:8px;font-family:\'DM Mono\',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;">Loading your teams…</p></div>';
    
    try {
        const teamsRef = collection(db, 'teamfinder_posts');
        const q = query(teamsRef, where('createdBy', '==', currentUser.email));
        const snapshot = await getDocs(q);
        
        if (snapshot.empty) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <p class="empty-text">You haven't created any teams yet</p>
                </div>
            `;
            return;
        }
        
        const teams = [];
        
        for (const docSnap of snapshot.docs) {
            const team = docSnap.data();
            team.id = docSnap.id;
            
            const requestsRef = collection(db, 'teamfinder_requests');
            const reqQuery = query(requestsRef,
                where('teamId', '==', docSnap.id),
                where('status', '==', 'pending')
            );
            const requestsSnapshot = await getDocs(reqQuery);
            
            team.requests = [];
            requestsSnapshot.forEach(reqDoc => {
                const req = reqDoc.data();
                req.id = reqDoc.id;
                team.requests.push(req);
            });
            
            teams.push(team);
        }
        
        teams.sort((a, b) => {
            const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
            const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
            return timeB - timeA;
        });
        
        const grid = document.createElement('div');
        grid.className = 'teams-grid';
        
        teams.forEach(team => {
            const card = createCreatedTeamCard(team);
            grid.appendChild(card);
        });
        
        container.innerHTML = '';
        container.appendChild(grid);
        
    } catch (error) {
        console.error('Error loading created teams:', error);
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p class="empty-text">Error loading teams</p></div>`;
    }
}

function createCreatedTeamCard(team) {
    const card = document.createElement('div');
    card.className = 'team-card';
    
    const needMore = team.needMore || 0;
    const memberCount = team.members ? team.members.length - 1 : 0;
    const totalTeamSize = memberCount + needMore;
    const isFull = needMore === 0;
    
    const creatorInitial = team.creatorName ? team.creatorName.charAt(0).toUpperCase() : 'C';
    
    let requestsHTML = '';
    if (team.requests && team.requests.length > 0) {
        requestsHTML = `
            <div class="requests-section">
                <div class="requests-title">⏳ Pending Requests (${team.requests.length})</div>
                ${team.requests.map(req => `
                    <div class="request-item">
                        <div class="request-name">${req.requesterName || req.requestedBy}</div>
                        <div class="request-contact">
                            <span>📧 ${req.requestedBy}</span>
                            ${req.requesterContact ? `<span>📞 ${req.requesterContact}</span>` : ''}
                        </div>
                        ${req.message ? `<div class="request-msg">"${req.message}"</div>` : ''}
                        <div class="request-actions">
                            <button class="btn-accept" onclick="acceptRequest('${team.id}', '${req.id}', '${req.requestedBy}', '${req.requesterName || ''}', '${req.requesterContact || ''}')">
                                ✓ Accept
                            </button>
                            <button class="btn-reject" onclick="rejectRequest('${req.id}', '${req.requestedBy}', '${team.id}')">
                                ✗ Reject
                            </button>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    let membersHTML = '';
    if (team.members && team.members.length > 0) {
        membersHTML = `
            <div class="members-section">
                <div class="members-title">👥 Members (${memberCount})</div>
                ${team.members.map((email, idx) => {
                    if (idx === 0) {
                        return `
                            <div class="member-item">
                                <div class="member-name">
                                    ${team.creatorName || email}
                                    <span class="member-badge">CREATOR</span>
                                </div>
                                <div class="member-details">
                                    <span>📧 ${email}</span>
                                    ${team.creatorContact ? `<span>📞 ${team.creatorContact}</span>` : ''}
                                </div>
                            </div>
                        `;
                    } else {
                        let memberInfo = { name: email, contact: '' };
                        if (team.memberDetails && Array.isArray(team.memberDetails)) {
                            const found = team.memberDetails.find(m => m.email === email);
                            if (found) memberInfo = { name: found.name || email, contact: found.contact || '' };
                        }
                        return `
                            <div class="member-item">
                                <div class="member-name">${memberInfo.name}</div>
                                <div class="member-details">
                                    <span>📧 ${email}</span>
                                    ${memberInfo.contact ? `<span>📞 ${memberInfo.contact}</span>` : ''}
                                </div>
                            </div>
                        `;
                    }
                }).join('')}
            </div>
        `;
    }
    
    card.innerHTML = `
        <div class="team-card-shimmer"></div>
        <div class="card-header">
            <div class="activity-badge">${team.activity}</div>
            <div class="member-fraction">${memberCount}/${totalTeamSize}</div>
        </div>
        <div class="card-body">
            <div class="contact-number">📞 ${team.creatorContact || 'N/A'}</div>
            <div class="creator-info">
                <div class="creator-avatar">${creatorInitial}</div>
                <div class="creator-details">
                    <div class="creator-name">${team.creatorName || 'Anonymous'}</div>
                    <div class="creator-email">${team.createdBy}</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="info-item">👥 ${needMore === 0 ? '✅ Full' : needMore + ' needed'}</div>
                ${team.location ? `<div class="location">📍 ${team.location}</div>` : ''}
            </div>
            <div class="message">${team.message}</div>
            ${team.date || team.time ? `
                <div class="datetime">
                    ${team.date ? `<span>📅 ${formatDate(team.date)}</span>` : ''}
                    ${team.time ? `<span>⏰ ${formatTime(team.time, team.ampm)}</span>` : ''}
                </div>
            ` : ''}
            ${membersHTML}
            ${requestsHTML}
        </div>
        <div class="card-footer">
            ${isFull ? `<button class="btn-reopen" onclick="reopenTeam('${team.id}')">📂 Reopen</button>` : ''}
            <button class="btn-delete" onclick="openDeleteModal('${team.id}')">🗑️ Delete</button>
        </div>
    `;
    
    return card;
}

// ══════════════════ LOAD JOINED TEAMS ══════════════════
async function loadJoinedTeams() {
    const container = document.getElementById('joinedTeamsContainer');
    
    if (!currentUser) return;
    
    container.innerHTML = '<div class="loading"><div class="spinner"></div><p style="color:rgba(255,255,255,0.30);margin-top:8px;font-family:\'DM Mono\',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;">Loading teams…</p></div>';
    
    try {
        const teamsRef = collection(db, 'teamfinder_posts');
        const q = query(teamsRef, where('members', 'array-contains', currentUser.email));
        const snapshot = await getDocs(q);
        
        if (snapshot.empty) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <p class="empty-text">You haven't joined any teams yet</p>
                </div>
            `;
            return;
        }
        
        const teams = [];
        snapshot.forEach(docSnap => {
            const team = docSnap.data();
            team.id = docSnap.id;
            if (team.createdBy === currentUser.email) return;
            teams.push(team);
        });
        
        if (teams.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <p class="empty-text">You haven't joined any teams yet</p>
                </div>
            `;
            return;
        }
        
        teams.sort((a, b) => {
            const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
            const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
            return timeB - timeA;
        });
        
        const grid = document.createElement('div');
        grid.className = 'teams-grid';
        
        teams.forEach(team => {
            const card = createJoinedTeamCard(team);
            grid.appendChild(card);
        });
        
        container.innerHTML = '';
        container.appendChild(grid);
        
    } catch (error) {
        console.error('Error loading joined teams:', error);
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p class="empty-text">Error loading teams</p></div>`;
    }
}

function createJoinedTeamCard(team) {
    const card = document.createElement('div');
    card.className = 'team-card';
    
    const needMore = team.needMore || 0;
    const memberCount = team.members ? team.members.length - 1 : 0;
    const totalTeamSize = memberCount + needMore;
    const creatorInitial = team.creatorName ? team.creatorName.charAt(0).toUpperCase() : 'C';
    
    let membersHTML = '';
    if (team.members && team.members.length > 0) {
        membersHTML = `
            <div class="members-section">
                <div class="members-title">👥 Members (${memberCount})</div>
                ${team.members.map((email, idx) => {
                    if (idx === 0) {
                        return `
                            <div class="member-item">
                                <div class="member-name">
                                    ${team.creatorName || email}
                                    <span class="member-badge">CREATOR</span>
                                </div>
                                <div class="member-details">
                                    <span>📧 ${email}</span>
                                    ${team.creatorContact ? `<span>📞 ${team.creatorContact}</span>` : ''}
                                </div>
                            </div>
                        `;
                    } else {
                        let memberInfo = { name: email, contact: '' };
                        if (team.memberDetails && Array.isArray(team.memberDetails)) {
                            const found = team.memberDetails.find(m => m.email === email);
                            if (found) memberInfo = { name: found.name || email, contact: found.contact || '' };
                        }
                        return `
                            <div class="member-item">
                                <div class="member-name">${memberInfo.name}</div>
                                <div class="member-details">
                                    <span>📧 ${email}</span>
                                    ${memberInfo.contact ? `<span>📞 ${memberInfo.contact}</span>` : ''}
                                </div>
                            </div>
                        `;
                    }
                }).join('')}
            </div>
        `;
    }
    
    card.innerHTML = `
        <div class="team-card-shimmer"></div>
        <div class="card-header">
            <div class="activity-badge">${team.activity}</div>
            <div class="member-fraction">${memberCount}/${totalTeamSize}</div>
        </div>
        <div class="card-body">
            <div class="contact-number">📞 ${team.creatorContact || 'N/A'}</div>
            <div class="creator-info">
                <div class="creator-avatar">${creatorInitial}</div>
                <div class="creator-details">
                    <div class="creator-name">${team.creatorName || 'Anonymous'}</div>
                    <div class="creator-email">${team.createdBy}</div>
                </div>
            </div>
            <div class="info-grid">
                <div class="info-item">👥 ${needMore === 0 ? '✅ Full' : needMore + ' needed'}</div>
                ${team.location ? `<div class="location">📍 ${team.location}</div>` : ''}
            </div>
            <div class="message">${team.message}</div>
            ${team.date || team.time ? `
                <div class="datetime">
                    ${team.date ? `<span>📅 ${formatDate(team.date)}</span>` : ''}
                    ${team.time ? `<span>⏰ ${formatTime(team.time, team.ampm)}</span>` : ''}
                </div>
            ` : ''}
            ${membersHTML}
        </div>
        <div class="card-footer">
            <button class="btn-leave" onclick="leaveTeam('${team.id}', '${team.activity}', '${team.createdBy}')">👋 Leave</button>
        </div>
    `;
    
    return card;
}

// ══════════════════ ACCEPT REQUEST ══════════════════
window.acceptRequest = async function(teamId, requestId, userEmail, userName, userContact) {
    try {
        const teamRef = doc(db, 'teamfinder_posts', teamId);
        const teamDoc = await getDoc(teamRef);
        const teamData = teamDoc.data();
        
        if (teamData.needMore <= 0) {
            alert('Team is already full!');
            return;
        }
        
        const updateData = {
            members: arrayUnion(userEmail),
            needMore: increment(-1)
        };
        
        if (userName) {
            updateData.memberDetails = arrayUnion({
                email: userEmail,
                name: userName,
                contact: userContact,
                isCreator: false
            });
        }
        
        await updateDoc(teamRef, updateData);
        
        const newNeedMore = teamData.needMore - 1;
        if (newNeedMore <= 0) {
            await updateDoc(teamRef, { open: false });
        }
        
        await deleteDoc(doc(db, 'teamfinder_requests', requestId));
        
        await addDoc(collection(db, 'notifications'), {
            userId: userEmail,
            type: 'request_accepted',
            teamId: teamId,
            message: `Your request to join ${teamData.activity} team has been accepted! 🎉`,
            read: false,
            timestamp: serverTimestamp()
        });
        
        alert('Request accepted! ✓');
        loadCreatedTeams();
        
    } catch (error) {
        console.error('Error accepting request:', error);
        alert('Error accepting request');
    }
}

// ══════════════════ REJECT REQUEST ══════════════════
window.rejectRequest = async function(requestId, userEmail, teamId) {
    if (!confirm('Reject this join request?')) return;
    
    try {
        const teamDoc = await getDoc(doc(db, 'teamfinder_posts', teamId));
        const teamData = teamDoc.data();
        
        await deleteDoc(doc(db, 'teamfinder_requests', requestId));
        
        await addDoc(collection(db, 'notifications'), {
            userId: userEmail,
            type: 'request_rejected',
            teamId: teamId,
            message: `Your request to join ${teamData.activity} team was declined`,
            read: false,
            timestamp: serverTimestamp()
        });
        
        alert('Request rejected ✗');
        loadCreatedTeams();
        
    } catch (error) {
        console.error('Error rejecting request:', error);
        alert('Error rejecting request');
    }
}

// ══════════════════ REOPEN TEAM ══════════════════
window.reopenTeam = async function(teamId) {
    const slots = prompt('How many more members do you need?', '1');
    if (!slots) return;
    
    const slotsNum = parseInt(slots);
    if (isNaN(slotsNum) || slotsNum < 1) {
        alert('Please enter a valid number');
        return;
    }
    
    try {
        await updateDoc(doc(db, 'teamfinder_posts', teamId), {
            open: true,
            needMore: slotsNum
        });
        
        alert('Team reopened! ✓');
        loadCreatedTeams();
        
    } catch (error) {
        console.error('Error reopening team:', error);
        alert('Error reopening team');
    }
}

// ══════════════════ LEAVE TEAM ══════════════════
window.leaveTeam = async function(teamId, activity, creatorEmail) {
    if (!confirm('Are you sure you want to leave this team?')) return;
    
    try {
        const teamRef = doc(db, 'teamfinder_posts', teamId);
        const teamDoc = await getDoc(teamRef);
        const teamData = teamDoc.data();
        
        await updateDoc(teamRef, {
            members: arrayRemove(currentUser.email),
            needMore: increment(1),
            open: true
        });
        
        if (teamData.memberDetails && Array.isArray(teamData.memberDetails)) {
            const filtered = teamData.memberDetails.filter(m => m.email !== currentUser.email);
            await updateDoc(teamRef, { memberDetails: filtered });
        }
        
        await addDoc(collection(db, 'notifications'), {
            userId: creatorEmail,
            type: 'member_left',
            teamId: teamId,
            message: `${currentUser.email} has left your ${activity} team`,
            read: false,
            timestamp: serverTimestamp()
        });
        
        alert('You left the team 👋');
        loadJoinedTeams();
        loadCreatedTeams();
        
    } catch (error) {
        console.error('Error leaving team:', error);
        alert('Error leaving team');
    }
}

// ══════════════════ DELETE TEAM ══════════════════
window.openDeleteModal = function(teamId) {
    deleteTeamId = teamId;
    document.getElementById('deleteModal').classList.add('show');
}

window.closeDeleteModal = function() {
    document.getElementById('deleteModal').classList.remove('show');
    deleteTeamId = null;
}

window.confirmDelete = async function() {
    if (!deleteTeamId) return;
    
    try {
        const requestsRef = collection(db, 'teamfinder_requests');
        const q = query(requestsRef, where('teamId', '==', deleteTeamId));
        const requestsSnapshot = await getDocs(q);
        
        const batch = writeBatch(db);
        requestsSnapshot.forEach(docSnap => {
            batch.delete(doc(db, 'teamfinder_requests', docSnap.id));
        });
        
        batch.delete(doc(db, 'teamfinder_posts', deleteTeamId));
        
        await batch.commit();
        
        window.closeDeleteModal();
        alert('Team deleted successfully 🗑️');
        loadCreatedTeams();
        
    } catch (error) {
        console.error('Error deleting team:', error);
        alert('Error deleting team');
    }
}
</script>
