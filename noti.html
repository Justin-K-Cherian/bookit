<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications – BookIt</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>

/* ════════════════════════════════════════
   DESIGN TOKENS — mirrored from user.html
════════════════════════════════════════ */
:root {
  --primary:      #19304D;
  --primary-mid:  #1f3c5e;
  --primary-lt:   #274d78;
  --primary-deep: #0f1f30;
  --white:        #ffffff;
  --off-white:    #eef0f4;
  --silver:       #b8bfcc;
  --muted:        rgba(255,255,255,0.35);
  --subtle:       rgba(255,255,255,0.08);

  /* status accent colours */
  --approved:     #3ecf8e;
  --cancelled:    #f05454;
  --rejected:     #f4a53a;
  --team:         #a78bfa;

  --c-low:        #3ecf8e;
  --c-medium:     #f4a53a;
  --c-high:       #f05454;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { min-height:100vh; font-family:'Outfit', sans-serif; overflow-x:hidden; }

/* ══════════════════════════════════════
   BACKGROUND — identical stripe system
══════════════════════════════════════ */
.bg {
  position:fixed; inset:0; z-index:0;
  background:#19304D;
  overflow:hidden;
}
.bg-depth {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 90% 80% at 0% 0%,   rgba(31,60,94,0.70) 0%, transparent 55%),
    radial-gradient(ellipse 70% 60% at 100% 100%, rgba(10,18,28,0.80) 0%, transparent 55%),
    radial-gradient(ellipse 55% 55% at 50% 50%,  rgba(25,48,77,0.20) 0%, transparent 70%);
}
.stripes {
  position:absolute; inset:-60% -20%;
  width:140%; height:220%;
  transform-origin:center center;
  transform:rotate(-28deg);
  pointer-events:none;
}
.stripe { position:absolute; top:0; bottom:0; }
.stripe-1 { left:14%;  width:7%;  background:rgba(255,255,255,0.038); }
.stripe-2 { left:25%;  width:11%; background:rgba(255,255,255,0.028); }
.stripe-3 { left:41%;  width:5%;  background:rgba(255,255,255,0.048); }
.stripe-4 { left:55%;  width:2%;  background:rgba(255,255,255,0.025); }
.stripe-5 { left:63%;  width:6%;  background:rgba(255,255,255,0.020); }
.stripe-6 { left:75%;  width:3%;  background:rgba(255,255,255,0.032); }
.stripe-edge {
  position:absolute; top:0; bottom:0; left:22%; width:1.5px;
  background:linear-gradient(180deg,
    transparent 0%, rgba(255,255,255,0.22) 15%,
    rgba(255,255,255,0.28) 40%, rgba(255,255,255,0.22) 65%, transparent 100%);
}
.stripe-edge-2 {
  position:absolute; top:0; bottom:0; left:38%; width:1px;
  background:linear-gradient(180deg,
    transparent 0%, rgba(255,255,255,0.14) 20%,
    rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.10) 75%, transparent 100%);
}
.bg-hlines {
  position:absolute; inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
  background-size:100% 180px; background-position:0 90px;
}
.bg-grain {
  position:absolute; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.80' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size:220px; opacity:0.55; pointer-events:none;
}
.bg-vignette {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 110% 110% at 50% 50%, transparent 45%, rgba(6,12,22,0.65) 100%),
    linear-gradient(180deg, rgba(6,12,22,0.20) 0%, transparent 15%, transparent 85%, rgba(6,12,22,0.35) 100%);
}

/* ══════════════════════════════════════
   CORNER MARKS (SVG overlay)
══════════════════════════════════════ */
.bg-corners {
  position:fixed; inset:0; pointer-events:none; z-index:1;
}

/* ══════════════════════════════════════
   TOPBAR
══════════════════════════════════════ */
.topbar {
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:0;
  height:66px;
  background:rgba(10,20,36,0.82);
  border-bottom:1px solid rgba(255,255,255,0.09);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
}

/* left accent bar matching stripe edge */
.topbar::before {
  content:'';
  position:absolute; left:0; top:0; bottom:0; width:2px;
  background:linear-gradient(180deg,
    transparent, rgba(255,255,255,0.25) 30%, rgba(255,255,255,0.38) 60%, transparent);
}

.topbar-left {
  display:flex; align-items:center; gap:18px; flex:1; min-width:0;
  padding:0 28px;
}

.back-btn {
  width:38px; height:38px; flex-shrink:0;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.05);
  color:rgba(255,255,255,0.65);
  font-size:15px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .24s cubic-bezier(.16,1,.3,1);
  font-family:'Outfit',sans-serif;
}
.back-btn:hover {
  background:rgba(255,255,255,0.12);
  border-color:rgba(255,255,255,0.32);
  color:#fff;
  transform:translateX(-3px);
  box-shadow:0 6px 20px rgba(0,0,0,0.40);
}

.topbar-vr {
  width:1px; height:28px; flex-shrink:0;
  background:rgba(255,255,255,0.10);
  margin:0 4px;
}

.topbar-heading { display:flex; flex-direction:column; gap:4px; min-width:0; }
.topbar-eyebrow {
  font-family:'Outfit', sans-serif;
  font-size:8px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:rgba(255,255,255,0.30); line-height:1;
}
.topbar-title {
  font-family:'Cormorant Garamond', serif;
  font-size:22px; font-weight:400; font-style:italic;
  color:var(--white);
  letter-spacing:-0.3px; line-height:1;
  display:flex; align-items:center; gap:12px;
}
.title-badge {
  font-family:'Outfit', sans-serif;
  font-style:normal; font-size:8px; font-weight:500;
  letter-spacing:3px; text-transform:uppercase;
  color:rgba(255,255,255,0.35);
  border:1px solid rgba(255,255,255,0.12);
  padding:3px 10px;
  background:rgba(255,255,255,0.04);
  vertical-align:middle;
}

.topbar-actions {
  display:flex; gap:8px; flex-shrink:0;
  padding-right:28px;
}

.mark-all-btn {
  padding:9px 22px;
  font-family:'Outfit', sans-serif;
  font-size:9px; font-weight:500; letter-spacing:3px; text-transform:uppercase;
  background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.75);
  border:1px solid rgba(255,255,255,0.18);
  cursor:pointer;
  position:relative; overflow:hidden;
  transition:all .24s ease;
}
.mark-all-btn::before {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.09), transparent);
  transform:translateX(-100%); transition:transform .5s ease;
}
.mark-all-btn:hover::before { transform:translateX(100%); }
.mark-all-btn:hover {
  background:rgba(255,255,255,0.14);
  border-color:rgba(255,255,255,0.35);
  color:#fff;
  box-shadow:0 6px 24px rgba(0,0,0,0.40);
}

.clear-btn {
  padding:9px 22px;
  font-family:'Outfit', sans-serif;
  font-size:9px; font-weight:500; letter-spacing:3px; text-transform:uppercase;
  background:rgba(240,84,84,0.08);
  color:rgba(240,140,140,0.80);
  border:1px solid rgba(240,84,84,0.22);
  cursor:pointer;
  position:relative; overflow:hidden;
  transition:all .24s ease;
}
.clear-btn:hover {
  background:rgba(240,84,84,0.16);
  border-color:rgba(240,84,84,0.45);
  color:#fff;
  box-shadow:0 6px 24px rgba(240,84,84,0.20);
}

/* ══════════════════════════════════════
   PAGE LAYOUT
══════════════════════════════════════ */
.page-content {
  position:relative; z-index:10;
  max-width:720px;
  margin:0 auto;
  padding:44px 28px 120px;
}

/* ══════════════════════════════════════
   SECTION LABEL
══════════════════════════════════════ */
.section-label {
  display:flex; align-items:center; gap:16px;
  margin:36px 0 16px;
}
.section-label-text {
  font-family:'Cormorant Garamond', serif;
  font-size:13px; font-weight:400; font-style:italic;
  letter-spacing:0.5px;
  color:rgba(255,255,255,0.40);
  white-space:nowrap;
}
.section-label-line {
  flex:1; height:1px;
  background:linear-gradient(90deg, rgba(255,255,255,0.16), transparent);
}
.section-count {
  font-family:'Outfit', sans-serif;
  font-size:8px; font-weight:500; letter-spacing:2px;
  color:rgba(255,255,255,0.40);
  border:1px solid rgba(255,255,255,0.12);
  padding:3px 10px;
  background:rgba(255,255,255,0.04);
}

/* ══════════════════════════════════════
   NOTIFICATION CARD
   Arrow column removed; icon column brightened
══════════════════════════════════════ */
.notif-card {
  position:relative;
  display:flex; align-items:stretch;
  margin-bottom:8px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.09);
  border-left:2px solid rgba(255,255,255,0.16);
  cursor:pointer; overflow:hidden;
  animation:cardIn .42s cubic-bezier(.16,1,.3,1) both;
  transition:all .34s cubic-bezier(.16,1,.3,1);
  backdrop-filter:blur(12px);
}

@keyframes cardIn {
  from { opacity:0; transform:translateY(18px); }
  to   { opacity:1; transform:translateY(0); }
}

/* Status left bar colours */
.notif-card.approved   { border-left-color:var(--approved); }
.notif-card.cancelled  { border-left-color:var(--cancelled); }
.notif-card.rejected   { border-left-color:var(--rejected); }
.notif-card.teamfinder { border-left-color:var(--team); }

/* Top edge highlight */
.notif-card::after {
  content:'';
  position:absolute; top:0; left:8%; right:8%; height:1px; z-index:10;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.30), transparent);
  opacity:0; transition:opacity .34s;
}
.notif-card:hover { 
  transform:translateY(-3px);
  background:rgba(255,255,255,0.07);
  border-color:rgba(255,255,255,0.18);
  box-shadow:0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05) inset;
}
.notif-card:hover::after { opacity:1; }

/* Shimmer sweep */
.notif-card::before {
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(108deg, transparent 32%, rgba(255,255,255,0.06) 50%, transparent 68%);
  transform:translateX(-130%); transition:transform .65s ease;
  pointer-events:none; z-index:1;
}
.notif-card:hover::before { transform:translateX(130%); }

/* Unread: warm veil */
.notif-card.unread {
  background:rgba(255,255,255,0.055);
  border-color:rgba(255,255,255,0.13);
}

.unread-bar {
  position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.12) 60%, transparent);
  z-index:2;
}

/* ── STATUS ICON COLUMN — brighter white ── */
.card-status-col {
  width:72px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  padding:22px 0;
  background:rgba(255,255,255,0.10);
  border-right:1px solid rgba(255,255,255,0.14);
  position:relative; z-index:2;
}

/* Brighter on hover */
.notif-card:hover .card-status-col {
  background:rgba(255,255,255,0.15);
}

.notif-icon {
  width:42px; height:42px;
  display:flex; align-items:center; justify-content:center;
  font-size:18px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.22);
}
.approved  .notif-icon { background:rgba(62,207,142,0.18);  border-color:rgba(62,207,142,0.40); }
.cancelled .notif-icon { background:rgba(240,84,84,0.18);   border-color:rgba(240,84,84,0.40);  }
.rejected  .notif-icon { background:rgba(244,165,58,0.18);  border-color:rgba(244,165,58,0.40); }
.teamfinder .notif-icon { background:rgba(167,139,250,0.18); border-color:rgba(167,139,250,0.40); }

/* ── MAIN CONTENT ── */
.card-main {
  flex:1; min-width:0;
  padding:18px 22px 18px 22px;
  display:flex; flex-direction:column; justify-content:center;
  position:relative; z-index:2;
}
.notif-label {
  font-family:'Outfit', sans-serif;
  font-size:8px; font-weight:500;
  letter-spacing:3.5px; text-transform:uppercase;
  margin-bottom:6px; line-height:1;
}
.approved  .notif-label { color:var(--approved); }
.cancelled .notif-label { color:var(--cancelled); }
.rejected  .notif-label { color:var(--rejected); }
.teamfinder .notif-label { color:var(--team); }

.notif-msg {
  font-family:'Outfit', sans-serif;
  font-size:13px; font-weight:300; line-height:1.65;
  color:rgba(255,255,255,0.72);
  margin-bottom:10px;
}
.notif-msg b {
  font-weight:500; color:rgba(255,255,255,0.92);
}

.notif-meta {
  display:flex; gap:14px; flex-wrap:wrap;
  font-family:'Outfit', sans-serif;
  font-size:10px; font-weight:400; letter-spacing:0.5px;
  color:rgba(255,255,255,0.28);
}
.notif-meta span { display:flex; align-items:center; gap:4px; }

/* ── UNREAD DOT ── */
.unread-dot {
  position:absolute; top:14px; right:14px;
  width:6px; height:6px; border-radius:50%;
  background:rgba(255,255,255,0.55);
  box-shadow:0 0 0 2px rgba(255,255,255,0.12), 0 0 10px rgba(255,255,255,0.25);
  animation:dotPulse 2.8s ease-in-out infinite; z-index:3;
}
@keyframes dotPulse {
  0%,100% { opacity:1; }
  50%     { opacity:0.40; }
}

/* ══════════════════════════════════════
   EMPTY STATE
══════════════════════════════════════ */
.empty-state { text-align:center; padding:110px 20px 80px; }
.empty-icon  { font-size:44px; margin-bottom:20px; opacity:0.25; }
.empty-title {
  font-family:'Cormorant Garamond', serif;
  font-size:28px; font-weight:300; font-style:italic;
  color:rgba(255,255,255,0.35);
  margin-bottom:10px;
}
.empty-sub {
  font-family:'Outfit', sans-serif;
  font-size:10px; font-weight:400; letter-spacing:3px; text-transform:uppercase;
  color:rgba(255,255,255,0.20);
}

/* ══════════════════════════════════════
   LOADER
══════════════════════════════════════ */
.loader { display:flex; justify-content:center; align-items:center; padding:120px 0; }
.spinner {
  width:32px; height:32px;
  border:1.5px solid rgba(255,255,255,0.10);
  border-top-color:rgba(255,255,255,0.45);
  border-radius:50%;
  animation:spin 0.80s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ══════════════════════════════════════
   PAGE HEADING — editorial block
══════════════════════════════════════ */
.page-header {
  width:100%; max-width:720px;
  margin:0 auto;
  padding:36px 28px 0;
  position:relative; z-index:10;
}
.page-header-inner {
  position:relative;
  padding:24px 0 20px;
  border-top:1px solid rgba(255,255,255,0.08);
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.page-header-inner::before,
.page-header-inner::after {
  content:''; position:absolute;
  width:16px; height:16px;
  border-style:solid; border-color:rgba(255,255,255,0.18);
}
.page-header-inner::before { top:-1px; left:0;  border-width:1px 0 0 1px; }
.page-header-inner::after  { top:-1px; right:0; border-width:1px 1px 0 0; }

.page-eyebrow {
  font-family:'Outfit', sans-serif;
  font-size:8px; font-weight:500; letter-spacing:5px; text-transform:uppercase;
  color:rgba(255,255,255,0.28);
  margin-bottom:10px;
}
.page-title-row {
  display:flex; align-items:baseline; gap:18px;
}
.page-title {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(36px, 5vw, 52px);
  font-weight:300; font-style:italic;
  color:var(--white);
  letter-spacing:-1.5px; line-height:0.9;
}
.page-title-sub {
  font-family:'Outfit', sans-serif;
  font-size:10px; font-weight:400; letter-spacing:2px;
  color:rgba(255,255,255,0.30);
  text-transform:uppercase;
  padding-bottom:4px;
}
.corner-bl, .corner-br {
  content:''; position:absolute;
  width:16px; height:16px;
  border-style:solid; border-color:rgba(255,255,255,0.18);
}
.corner-bl { bottom:-1px; left:0;  border-width:0 0 1px 1px; }
.corner-br { bottom:-1px; right:0; border-width:0 1px 1px 0; }

/* ══════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════ */
@media (max-width:600px) {
  .topbar { height:58px; }
  .topbar-left { padding:0 16px; }
  .topbar-actions { padding-right:16px; }
  .topbar-title { font-size:19px; }
  .title-badge { display:none; }
  .mark-all-btn, .clear-btn { padding:8px 12px; font-size:8px; letter-spacing:1.5px; }
  .page-header { padding:24px 16px 0; }
  .page-content { padding:28px 16px 100px; }
  .card-status-col { width:56px; }
}

</style>
</head>
<body>

<!-- ══ BACKGROUND ══ -->
<div class="bg">
  <div class="bg-depth"></div>
  <div class="stripes">
    <div class="stripe stripe-1"></div>
    <div class="stripe stripe-2"></div>
    <div class="stripe stripe-3"></div>
    <div class="stripe stripe-4"></div>
    <div class="stripe stripe-5"></div>
    <div class="stripe stripe-6"></div>
    <div class="stripe-edge"></div>
    <div class="stripe-edge-2"></div>
  </div>
  <div class="bg-hlines"></div>
  <div class="bg-grain"></div>
  <div class="bg-vignette"></div>
</div>

<!-- Corner marks -->
<svg class="bg-corners" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <polyline points="70,48 24,48 24,4 70,4"           fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <polyline points="1370,4 1416,4 1416,48 1370,48"   fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <polyline points="24,852 24,896 70,896"             fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <polyline points="1416,852 1416,896 1370,896"       fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <circle cx="720" cy="42"  r="2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="720" cy="858" r="2" fill="rgba(255,255,255,0.10)"/>
  <circle cx="24"  cy="450" r="2" fill="rgba(255,255,255,0.10)"/>
  <circle cx="1416" cy="450" r="2" fill="rgba(255,255,255,0.10)"/>
</svg>

<!-- ══ TOPBAR ══ -->
<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn" onclick="history.back()">&#8592;</button>
    <div class="topbar-vr"></div>
    <div class="topbar-heading">
      <span class="topbar-eyebrow">BookIt &nbsp;—&nbsp; Inbox</span>
      <span class="topbar-title">
        Notifications
        <span class="title-badge">INBOX</span>
      </span>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="mark-all-btn" onclick="markAllRead()">Mark all read</button>
    <button class="clear-btn" onclick="clearAll()">Clear all</button>
  </div>
</div>

<!-- ══ PAGE HEADING ══ -->
<div class="page-header">
  <div class="page-header-inner">
    <span class="corner-bl"></span>
    <span class="corner-br"></span>
    <div class="page-eyebrow">Activity &nbsp;/&nbsp; Alerts</div>
    <div class="page-title-row">
      <span class="page-title">Your Notifications</span>
      <span class="page-title-sub">Latest updates</span>
    </div>
  </div>
</div>

<!-- ══ MAIN CONTENT ══ -->
<div class="page-content" id="mainContainer">
  <div class="loader"><div class="spinner"></div></div>
</div>

<!-- ══════════════════════════════════
     ALL SCRIPT BELOW IS UNTOUCHED
══════════════════════════════════════ -->
<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  collection, query, where, getDocs, doc,
  updateDoc, deleteDoc, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let currentUser = null;
let allItems = [];   // merged list rendered on screen

/* ─── AUTH GATE ─── */
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "index.html";
  currentUser = user;
  await loadAll();
});


/* ══════════════════════════════
   LOAD ALL NOTIFICATIONS
══════════════════════════════ */
async function loadAll() {
  const container = document.getElementById('mainContainer');
  container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

  try {
    const [bookingItems, notifItems] = await Promise.all([
      fetchBookingNotifs(),
      fetchFirestoreNotifs()
    ]);

    allItems = [...bookingItems, ...notifItems];

    // Sort newest first
    allItems.sort((a, b) => (b.ts || 0) - (a.ts || 0));

    render(container);

  } catch(err) {
    console.error(err);
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load notifications</p></div>`;
  }
}


/* ─── BOOKING NOTIFICATIONS (from bookings collection) ─── */
async function fetchBookingNotifs() {
  const readIds = JSON.parse(localStorage.getItem('readBookingNotifs') || '[]');

  const q = query(
    collection(db, 'bookings'),
    where('userId', '==', currentUser.uid),
    where('status', 'in', ['approved', 'cancelled', 'rejected'])
  );

  const snap = await getDocs(q);
  const items = [];

  snap.forEach(d => {
    const data = d.data();
    const status = data.status;

    const icons = { approved:'✅', cancelled:'❌', rejected:'🚫' };
    const labels = { approved:'Booking Approved', cancelled:'Booking Cancelled', rejected:'Booking Rejected' };

    const facilityName = data.facility
      ? data.facility.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())
      : 'Unknown Facility';

    const msg = {
      approved: `Your booking for <b>${facilityName}</b> on ${data.date} has been approved.`,
      cancelled: `Your booking for <b>${facilityName}</b> on ${data.date} was cancelled.`,
      rejected:  `Your booking for <b>${facilityName}</b> on ${data.date} was rejected.`
    }[status];

    const ts = data.approvedAt
      ? data.approvedAt.toMillis()
      : (data.createdAt ? data.createdAt.toMillis() : 0);

    items.push({
      id: d.id,
      source: 'booking',
      type: status,
      icon: icons[status],
      label: labels[status],
      msg,
      date: data.date || '',
      time: data.time || '',
      facility: facilityName,
      facilityType: data.facilityType || '',
      ts,
      read: readIds.includes(d.id)
    });
  });

  return items;
}


/* ─── FIRESTORE NOTIFICATIONS (teamfinder etc.) ─── */
async function fetchFirestoreNotifs() {
  const q = query(
    collection(db, 'notifications'),
    where('userId', '==', currentUser.email),
    limit(30)
  );

  const snap = await getDocs(q);
  const items = [];

  snap.forEach(d => {
    const data = d.data();
    const ts = data.timestamp ? data.timestamp.toMillis() : 0;

    items.push({
      id: d.id,
      source: 'firestore',
      type: 'teamfinder',
      icon: data.type === 'join_request' ? '🤝' : '🎉',
      label: data.type === 'join_request' ? 'Team Join Request' : 'Team Update',
      msg: data.message || 'You have a new notification',
      ts,
      read: data.read || false,
      rawType: data.type
    });
  });

  return items;
}


/* ══════════════════════════════
   RENDER
══════════════════════════════ */
function render(container) {
  if (allItems.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔕</div>
        <div class="empty-title">All Clear</div>
        <div class="empty-sub">No notifications yet</div>
      </div>`;
    return;
  }

  // Separate into sections
  const bookings  = allItems.filter(i => i.source === 'booking');
  const teamfinds = allItems.filter(i => i.source === 'firestore');

  let html = '';

  if (bookings.length) {
    html += `
      <div class="section-label">
        <span class="section-label-text">Bookings</span>
        <div class="section-label-line"></div>
      </div>`;
    bookings.forEach((item, idx) => {
      html += buildCard(item, idx);
    });
  }

  if (teamfinds.length) {
    html += `
      <div class="section-label">
        <span class="section-label-text">Team Finder</span>
        <div class="section-label-line"></div>
      </div>`;
    teamfinds.forEach((item, idx) => {
      html += buildCard(item, idx + bookings.length);
    });
  }

  container.innerHTML = html;
}


function buildCard(item, idx) {
  const delay = idx * 0.05;
  const unreadDot = !item.read ? '<div class="unread-dot"></div><div class="unread-bar"></div>' : '';

  const metaTime = item.ts ? getTimeAgo(new Date(item.ts)) : '';
  const metaExtra = item.time
    ? `<span>🕐 ${item.time}</span>`
    : '';
  const metaType = item.facilityType
    ? `<span>${item.facilityType === 'sport' ? '🏟️' : '🎭'} ${item.facilityType}</span>`
    : '';

  return `
    <div class="notif-card ${item.type} ${item.read ? '' : 'unread'}"
         style="animation-delay:${delay}s"
         onclick="handleClick('${item.id}','${item.source}','${item.rawType||''}')">
      ${unreadDot}
      <div class="card-status-col">
        <div class="notif-icon">${item.icon}</div>
      </div>
      <div class="card-main">
        <div class="notif-label">${item.label}</div>
        <div class="notif-msg">${item.msg}</div>
        <div class="notif-meta">
          ${metaTime ? `<span>🕒 ${metaTime}</span>` : ''}
          ${metaExtra}
          ${metaType}
        </div>
      </div>
    </div>`;
}


/* ══════════════════════════════
   CLICK HANDLER
══════════════════════════════ */
window.handleClick = async function(id, source, rawType) {
  // Mark as read
  if (source === 'booking') {
    const readIds = JSON.parse(localStorage.getItem('readBookingNotifs') || '[]');
    if (!readIds.includes(id)) {
      readIds.push(id);
      localStorage.setItem('readBookingNotifs', JSON.stringify(readIds));
    }
  } else {
    try {
      await updateDoc(doc(db, 'notifications', id), { read: true });
    } catch(e) { console.error(e); }
  }

  // Navigate
  if (source === 'firestore' && rawType === 'join_request') {
    location.href = 'myteams.html';
  }
  // else stay on page and refresh
  await loadAll();
}


/* ══════════════════════════════
   MARK ALL READ
══════════════════════════════ */
window.markAllRead = async function() {
  // Booking items
  const bookingIds = allItems
    .filter(i => i.source === 'booking' && !i.read)
    .map(i => i.id);

  if (bookingIds.length) {
    const readIds = JSON.parse(localStorage.getItem('readBookingNotifs') || '[]');
    const merged = [...new Set([...readIds, ...bookingIds])];
    localStorage.setItem('readBookingNotifs', JSON.stringify(merged));
  }

  // Firestore notification items
  const firestoreUnread = allItems.filter(i => i.source === 'firestore' && !i.read);
  await Promise.all(
    firestoreUnread.map(i => updateDoc(doc(db, 'notifications', i.id), { read: true }))
  );

  await loadAll();
}


/* ══════════════════════════════
   CLEAR ALL
══════════════════════════════ */
window.clearAll = async function() {
  if (!confirm('Clear all notifications?')) return;

  // Clear booking read tracking
  const bookingIds = allItems.filter(i => i.source === 'booking').map(i => i.id);
  const readIds = JSON.parse(localStorage.getItem('readBookingNotifs') || '[]');
  const merged = [...new Set([...readIds, ...bookingIds])];
  localStorage.setItem('readBookingNotifs', JSON.stringify(merged));

  // Delete firestore notification docs
  const firestoreItems = allItems.filter(i => i.source === 'firestore');
  await Promise.all(
    firestoreItems.map(i => deleteDoc(doc(db, 'notifications', i.id)))
  );

  await loadAll();
}


/* ── HELPERS ── */
function getTimeAgo(date) {
  const s = Math.floor((new Date() - date) / 1000);
  if (s < 60)   return 'Just now';
  if (s < 3600) return Math.floor(s/60) + ' min ago';
  if (s < 86400)return Math.floor(s/3600) + ' hr ago';
  if (s < 2592000) return Math.floor(s/86400) + ' days ago';
  if (s < 31536000) return Math.floor(s/2592000) + ' months ago';
  return Math.floor(s/31536000) + ' years ago';
}

</script>
