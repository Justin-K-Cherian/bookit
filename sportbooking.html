<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Booking Requests – BookIt</title>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getAuth, onAuthStateChanged, signOut 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
    getFirestore, collection, query, where, getDocs, doc, updateDoc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "Your-API-KEY",
  authDomain: "AUTHDOMAIN",
  projectId: "PROJECT ID",
  storageBucket: "PROJECT ID.appspot.com",
  messagingSenderId: "MESSAGE SENDER ID",
  appId: "1:MESSAGE SENDER ID:APP ID"
};

const app = initializeApp(firebaseConfig);
window.auth = getAuth(app);
window.db = getFirestore(app);
</script>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --g900:#052e16; --g800:#064e3b; --g700:#065f46; --g600:#047857;
  --g500:#059669; --g400:#10b981; --g300:#34d399; --g200:#6ee7b7;
  --g100:#a7f3d0; --g50:#d1fae5;  --g25:#ecfdf5;  --g10:#f0fdf4;
  --w:#ffffff;
  --s900:#0f172a; --s800:#1e293b; --s700:#334155; --s600:#475569;
  --s500:#64748b; --s400:#94a3b8; --s300:#cbd5e1; --s200:#e2e8f0;
  --s100:#f1f5f9; --s50:#f8fafc;
  --r500:#ef4444; --r100:#fee2e2; --r50:#fef2f2;
  --amber:#d97706; --amber-l:#fef3c7;
  --fd:'DM Serif Display',serif;
  --fb:'DM Sans',sans-serif;
  --shadow-sm:0 1px 3px rgba(6,78,59,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(6,78,59,.10),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 12px 36px rgba(6,78,59,.14),0 4px 12px rgba(0,0,0,.06);
  --shadow-xl:0 24px 56px rgba(6,78,59,.18),0 8px 20px rgba(0,0,0,.08);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; scroll-behavior:smooth; }
body { font-family:var(--fb); background:var(--g10); color:var(--s800); min-height:100vh; line-height:1.6; }

/* ── TOPBAR ── */
.topbar {
  background:var(--w);
  border-bottom:1px solid var(--g50);
  padding:0 40px; height:68px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
  box-shadow:0 1px 0 var(--g50),var(--shadow-sm);
}
.tl { display:flex; align-items:center; gap:16px; animation:slideRight .5s ease both; }
.bico {
  width:42px; height:42px; border-radius:10px;
  background:linear-gradient(135deg,var(--g400),var(--g700));
  display:flex; align-items:center; justify-content:center;
  font-size:20px; box-shadow:0 2px 8px rgba(5,150,105,.35);
}
.brand-group { display:flex; flex-direction:column; }
.bn { font-family:var(--fd); font-size:19px; color:var(--g900); line-height:1.1; }
.bsub { font-size:10.5px; font-weight:600; color:var(--g500); letter-spacing:.1em; text-transform:uppercase; }
.topbar-divider { width:1px; height:28px; background:var(--g50); }
.portal-pill {
  background:var(--g25); border:1.5px solid var(--g100); color:var(--g700);
  font-size:12px; font-weight:700; padding:5px 14px; border-radius:20px; letter-spacing:.04em;
}
.tr { display:flex; align-items:center; gap:12px; animation:slideLeft .5s ease both; }
.up {
  display:flex; align-items:center; gap:10px;
  background:var(--g10); border:1.5px solid var(--g50); border-radius:32px;
  padding:5px 14px 5px 5px;
  transition:border-color .18s,background .18s; cursor:default;
}
.up:hover { border-color:var(--g200); background:var(--g25); }
.ua {
  width:30px; height:30px; border-radius:50%;
  background:linear-gradient(135deg,var(--g400),var(--g700));
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; color:white; flex-shrink:0;
}
.ue { font-size:13.5px; font-weight:600; color:var(--s700); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ur { font-size:11px; font-weight:500; color:var(--g600); }
.lob {
  display:flex; align-items:center; gap:7px;
  background:var(--w); border:1.5px solid var(--s200); color:var(--s600);
  padding:8px 16px; border-radius:8px;
  font-family:var(--fb); font-size:13.5px; font-weight:600;
  cursor:pointer; transition:all .18s;
}
.lob:hover { background:var(--r50); border-color:var(--r100); color:var(--r500); }

/* ── LAYOUT ── */
.container { max-width:1100px; margin:0 auto; padding:40px 32px 80px; }

/* ── PAGE HEADER BANNER ── */
.page-header {
  background:var(--g900); border-radius:16px;
  padding:32px 36px; margin-bottom:28px;
  position:relative; overflow:hidden;
  box-shadow:var(--shadow-xl);
  animation:fadeUp .4s ease both;
}
.page-header::before {
  content:''; position:absolute; right:-50px; top:-50px;
  width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle,rgba(52,211,153,.14),transparent 70%);
}
.page-header::after {
  content:''; position:absolute; left:-30px; bottom:-40px;
  width:160px; height:160px; border-radius:50%;
  background:radial-gradient(circle,rgba(16,185,129,.08),transparent 70%);
}
.page-header-inner {
  position:relative; z-index:1;
  display:flex; align-items:center; gap:18px;
}
.ph-icon {
  font-size:44px;
  filter:drop-shadow(0 4px 12px rgba(52,211,153,.3));
  animation:float 4s ease-in-out infinite;
}
.page-header h1 { font-family:var(--fd); font-size:28px; color:white; margin-bottom:4px; line-height:1.2; }
.page-header p { font-size:14px; color:rgba(255,255,255,.65); font-weight:400; }
.page-header-eyebrow {
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--g300); margin-bottom:10px;
  background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.2);
  padding:3px 10px; border-radius:20px;
}

/* ── STATS ── */
.stats-grid {
  display:flex; gap:16px; margin-bottom:28px; flex-wrap:wrap;
  animation:fadeUp .4s .03s ease both;
}
.stat-card {
  background:var(--w); border:1.5px solid var(--g50);
  border-radius:12px; padding:20px 28px;
  display:flex; align-items:center; gap:14px;
  box-shadow:var(--shadow-sm);
  min-width:180px;
}
.stat-icon {
  width:42px; height:42px; border-radius:10px;
  background:var(--g25); display:flex; align-items:center;
  justify-content:center; font-size:20px; flex-shrink:0;
}
.stat-number { font-family:var(--fd); font-size:28px; color:var(--g700); line-height:1; }
.stat-label { font-size:12px; font-weight:600; color:var(--s500); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

/* ── FILTER BOX ── */
.filter-box {
  background:var(--w); border:1.5px solid var(--g50);
  border-radius:12px; padding:20px 22px; margin-bottom:24px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  box-shadow:var(--shadow-sm);
  animation:fadeUp .4s .05s ease both;
}
.filter-box label { font-size:13px; font-weight:700; color:var(--g600); }
.filter-box select,
.filter-box input[type="date"] {
  padding:9px 14px; border-radius:8px;
  border:1.5px solid var(--g50); background:var(--g25);
  color:var(--s800); font-family:var(--fb);
  font-size:14px; font-weight:500; outline:none;
  transition:border-color .18s;
}
.filter-box select option { background:var(--w); color:var(--s800); }
.filter-box select:focus,
.filter-box input[type="date"]:focus {
  border-color:var(--g400); background:var(--w);
  box-shadow:0 0 0 3px rgba(16,185,129,.10);
}
.filter-box span { font-size:13px; font-weight:600; color:var(--s500); }

/* ── FILTER BUTTONS ── */
.filter-btn {
  padding:9px 18px; border:none; border-radius:8px;
  font-family:var(--fb); font-size:14px; font-weight:600;
  cursor:pointer; transition:all .18s;
}
.apply-btn {
  background:linear-gradient(135deg,var(--g400),var(--g700));
  color:white; box-shadow:0 3px 10px rgba(6,78,59,.2);
}
.apply-btn:hover { transform:translateY(-2px); box-shadow:0 5px 14px rgba(6,78,59,.3); }
.clear-btn {
  background:var(--w); border:1.5px solid var(--s200); color:var(--s600);
}
.clear-btn:hover { background:var(--s100); border-color:var(--s300); }

/* ── REQUEST CARDS ── */
.requests-container { display:grid; gap:16px; }

.request-card {
  background:var(--w); border:1.5px solid var(--g50);
  border-left:5px solid var(--g400);
  border-radius:14px; padding:24px;
  box-shadow:var(--shadow-sm);
  display:flex; justify-content:space-between; align-items:center;
  transition:all .2s;
  animation:fadeUp .4s ease both;
}
.request-card:hover {
  transform:translateX(4px);
  box-shadow:var(--shadow-md);
  border-color:var(--g100);
}
/* status-based left border colours */
.request-card.card-pending  { border-left-color:var(--amber); }
.request-card.card-approved { border-left-color:var(--g400); }
.request-card.card-rejected { border-left-color:var(--r500); }

.request-info { flex:1; }
.request-info p {
  margin:6px 0; color:var(--s700);
  font-size:14px; font-weight:500;
  display:flex; align-items:center; gap:8px;
}
.request-info strong { color:var(--g700); font-weight:700; }

/* ── STATUS BADGE ── */
.status-badge {
  display:inline-block; font-size:11px; font-weight:700;
  padding:3px 10px; border-radius:20px;
  text-transform:uppercase; letter-spacing:.06em; margin-left:8px;
}
.status-pending  { background:var(--amber-l); color:var(--amber); }
.status-approved { background:var(--g25); color:var(--g600); }
.status-rejected { background:var(--r50); color:var(--r500); }

/* ── ACTION BUTTONS ── */
.request-actions { display:flex; gap:10px; flex-shrink:0; margin-left:20px; }

.approve-btn {
  background:linear-gradient(135deg,var(--g400),var(--g700));
  color:white; border:none;
  padding:9px 20px; border-radius:8px;
  font-family:var(--fb); font-size:14px; font-weight:600;
  cursor:pointer; transition:all .18s;
  box-shadow:0 3px 10px rgba(6,78,59,.2);
}
.approve-btn:hover { transform:translateY(-2px); box-shadow:0 5px 14px rgba(6,78,59,.3); }

.reject-btn {
  background:var(--r50); border:1.5px solid var(--r100); color:var(--r500);
  padding:9px 20px; border-radius:8px;
  font-family:var(--fb); font-size:14px; font-weight:600;
  cursor:pointer; transition:all .18s;
}
.reject-btn:hover { background:var(--r500); color:white; border-color:var(--r500); transform:translateY(-2px); }

/* ── BACK BUTTON ── */
.back-btn {
  display:inline-flex; align-items:center; gap:8px;
  background:var(--w); border:1.5px solid var(--g100); color:var(--g700);
  padding:9px 18px; border-radius:9px;
  font-family:var(--fb); font-size:14px; font-weight:600;
  cursor:pointer; transition:all .18s; margin-top:28px;
  box-shadow:var(--shadow-sm);
}
.back-btn:hover { border-color:var(--g400); background:var(--g25); transform:translateX(-3px); }

/* ── EMPTY STATE ── */
.empty-state {
  text-align:center; padding:60px 20px;
  background:var(--w); border:2px dashed var(--g100); border-radius:14px;
}
.empty-state h3 { font-family:var(--fd); font-size:20px; color:var(--g700); margin-bottom:8px; }
.empty-state p { color:var(--s500); font-size:14px; }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:28px; right:28px;
  background:var(--g800); color:white;
  padding:14px 22px; border-radius:10px;
  box-shadow:var(--shadow-lg);
  display:none; z-index:1000;
  font-weight:600; font-size:14px;
  border-left:4px solid var(--g300);
}
.toast.error { background:var(--r500); border-left-color:#fca5a5; }

.hidden { display:none !important; }

/* ── LOADING ── */
@keyframes spin { to { transform:rotate(360deg); } }
.loading {
  display:inline-block; width:20px; height:20px;
  border:3px solid rgba(255,255,255,.3);
  border-radius:50%; border-top-color:white;
  animation:spin .8s linear infinite;
}

/* ── ANIMATIONS ── */
@keyframes fadeUp    { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
@keyframes slideRight{ from{opacity:0;transform:translateX(-14px)} to{opacity:1;transform:none} }
@keyframes slideLeft { from{opacity:0;transform:translateX(14px)} to{opacity:1;transform:none} }
@keyframes float     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:var(--g10); }
::-webkit-scrollbar-thumb { background:var(--g100); border-radius:4px; }

@media(max-width:768px){
  .topbar { padding:0 18px; }
  .ue { max-width:100px; }
  .container { padding:24px 16px 60px; }
  .request-card { flex-direction:column; align-items:flex-start; gap:14px; }
  .request-actions { margin-left:0; width:100%; }
  .approve-btn, .reject-btn { flex:1; }
  .filter-box { flex-direction:column; align-items:stretch; }
  .stats-grid { flex-direction:column; }
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tl">
    <div class="bico">📋</div>
    <div class="brand-group">
      <div class="bn">BookIt</div>
      <div class="bsub">Sports Admin</div>
    </div>
    <div class="topbar-divider"></div>
    <span class="portal-pill">🏅 Booking Requests</span>
  </div>
  <div class="tr">
    <div class="up">
      <div class="ua">A</div>
      <div>
        <div class="ue" id="adminEmail">Loading…</div>
        <div class="ur">Sports Admin - Booking Requests</div>
      </div>
    </div>
    <button class="lob" onclick="logoutNow()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </button>
  </div>
</div>

<div class="container">

  <!-- PAGE HEADER BANNER -->
  <div class="page-header">
    <div class="page-header-inner">
      <div class="ph-icon">📋</div>
      <div>
        <div class="page-header-eyebrow">✦ Sports Admin</div>
        <h1>Sports Booking Requests</h1>
        <p>Manage and review booking requests for sports facilities</p>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">📋</div>
      <div>
        <div class="stat-number" id="totalRequests">0</div>
        <div class="stat-label">Total Requests</div>
      </div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filter-box">
    <label>🏅 Facility:</label>
    <select id="facilityFilter">
      <option value="">All Facilities</option>
      <option value="cricket-nets">🏏 Cricket Nets</option>
      <option value="Table Tennis">🏓 Table Tennis</option>
      <option value="Outdoor Badminton Court">🏸 Outdoor Badminton Court</option>
      <option value="Volleyball">🏐 Volleyball</option>
      <option value="main-ground">⚽ Main Ground</option>
      <option value="Basketball">🏀 Basketball</option>
      <option value="Indoor Badminton Court">🏸 Indoor Badminton Court</option>
      <option value="Carroms">🎯 Carroms</option>
    </select>

    <label>📊 Status:</label>
    <select id="statusFilter">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>

    <label>📅 Date From:</label>
    <input type="date" id="fromDate">
    <span>to</span>
    <input type="date" id="toDate">

    <button class="filter-btn apply-btn" onclick="applyFilters()">Apply Filters</button>
    <button class="filter-btn clear-btn" onclick="clearFilters()">Clear All</button>
  </div>

  <!-- REQUESTS CONTAINER -->
  <div id="requestsContainer" class="requests-container"></div>

  <button class="back-btn" onclick="history.back()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </button>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
import { onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { 
    collection, query, where, getDocs, updateDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

let allRequests = [];

// AUTH CHECK
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        location.href = "index.html";
        return;
    }
    document.getElementById("adminEmail").textContent = user.email;
    loadBookingRequests();
});

// LOGOUT
window.logoutNow = function() {
    signOut(auth).then(() => location.href = "index.html");
};

// LOAD BOOKING REQUESTS
async function loadBookingRequests() {
    try {
        const q = query(
            collection(db, "bookings"),
            where("facilityType", "==", "sport")
        );

        const snap = await getDocs(q);
        allRequests = [];

        snap.forEach(d => {
            let data = d.data();
            data.id = d.id;
            allRequests.push(data);
        });

        // Sort by date and time (newest first)
        allRequests.sort((a, b) => {
            if (a.date !== b.date) {
                return b.date.localeCompare(a.date);
            }
            return b.time.localeCompare(a.time);
        });

        updateStats();
        displayRequests(allRequests);
    } catch (error) {
        console.error("Error loading requests:", error);
        showToast("Error loading booking requests", true);
    }
}

// UPDATE STATS
function updateStats() {
    const total = allRequests.length;

    document.getElementById("totalRequests").textContent = total;
}

// DISPLAY REQUESTS
function displayRequests(requests) {
    const container = document.getElementById("requestsContainer");
    container.innerHTML = "";

    if (requests.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <h3>No booking requests found</h3>
                <p>There are no booking requests matching your filters.</p>
            </div>
        `;
        return;
    }

    requests.forEach(request => {
        const card = document.createElement("div");
        const status = request.status || "pending";
        card.className = `request-card card-${status}`;
        
        const statusClass = `status-${status}`;

        const info = document.createElement("div");
        info.className = "request-info";
        info.innerHTML = `
            <p><strong>📧 Email:</strong> ${request.email}</p>
            <p><strong>🏅 Facility:</strong> ${request.facility}</p>
            <p><strong>📅 Date:</strong> ${request.date}</p>
            <p><strong>⏰ Time:</strong> ${request.time}</p>
            <p><strong>📊 Status:</strong> <span class="status-badge ${statusClass}">${status}</span></p>
        `;

        card.appendChild(info);

        // Only show action buttons for pending requests
        if (status === "pending") {
            const actions = document.createElement("div");
            actions.className = "request-actions";
            
            const approveBtn = document.createElement("button");
            approveBtn.className = "approve-btn";
            approveBtn.textContent = "✓ Approve";
            approveBtn.onclick = () => updateRequestStatus(request.id, "approved");
            
            const rejectBtn = document.createElement("button");
            rejectBtn.className = "reject-btn";
            rejectBtn.textContent = "✗ Reject";
            rejectBtn.onclick = () => updateRequestStatus(request.id, "rejected");
            
            actions.appendChild(approveBtn);
            actions.appendChild(rejectBtn);
            card.appendChild(actions);
        }

        container.appendChild(card);
    });
}

// UPDATE REQUEST STATUS
window.updateRequestStatus = async function(requestId, status) {
    const action = status === "approved" ? "approve" : "reject";
    if (!confirm(`Are you sure you want to ${action} this booking request?`)) return;

    try {
        await updateDoc(doc(db, "bookings", requestId), {
            status: status
        });

        showToast(`Booking request ${status}!`);
        loadBookingRequests();
    } catch (error) {
        console.error("Error updating request:", error);
        showToast("Error updating booking request", true);
    }
};

// APPLY FILTERS
window.applyFilters = function() {
    const facility = document.getElementById("facilityFilter").value;
    const status = document.getElementById("statusFilter").value;
    const fromDate = document.getElementById("fromDate").value;
    const toDate = document.getElementById("toDate").value;

    let filtered = [...allRequests];

    if (facility) {
        filtered = filtered.filter(r => r.facility === facility);
    }

    if (status) {
        filtered = filtered.filter(r => (r.status || "pending") === status);
    }

    if (fromDate) {
        filtered = filtered.filter(r => r.date >= fromDate);
    }

    if (toDate) {
        filtered = filtered.filter(r => r.date <= toDate);
    }

    displayRequests(filtered);
};

// CLEAR FILTERS
window.clearFilters = function() {
    document.getElementById("facilityFilter").value = "";
    document.getElementById("statusFilter").value = "";
    document.getElementById("fromDate").value = "";
    document.getElementById("toDate").value = "";
    displayRequests(allRequests);
};

// TOAST NOTIFICATION
function showToast(message, isError = false) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = isError ? "toast error" : "toast";
    toast.style.display = "block";
    setTimeout(() => {
        toast.style.display = "none";
    }, 3000);
}
</script>
