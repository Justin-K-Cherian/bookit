<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
    getAuth, 
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
// ✅ Added Firestore imports to update mustChangePassword flag
import {
    getFirestore,
    doc,
    getDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDYD768C9UY7PHq8BrQLN8paau3LmXAnFs",
  authDomain: "bookit-56e35.firebaseapp.com",
  projectId: "bookit-56e35",
  storageBucket: "bookit-56e35.appspot.com",
  messagingSenderId: "813441391899",
  appId: "1:813441391899:web:d5bf9d33c6b81c983a87be"
};

const app = initializeApp(firebaseConfig);
window.auth = getAuth(app);
window.db   = getFirestore(app);          // ✅ Expose db globally
window.EmailAuthProvider = EmailAuthProvider;
window.reauthenticateWithCredential = reauthenticateWithCredential;
window.updatePassword = updatePassword;
window.firestoreDoc = doc;                // ✅ Expose doc helper
window.firestoreGetDoc = getDoc;          // ✅ Expose getDoc for role fallback
window.firestoreUpdateDoc = updateDoc;    // ✅ Expose updateDoc helper
</script>

<style>
:root {
  --green-dark:  #2c5830;
  --green-mid:   #3d7844;
  --green-light: #e8f5e8;
  --green-pale:  #f2faf2;
  --sage:        #90bf90;
  --yellow:      #f5c400;
  --yellow2:     #ffd740;
  --white:       #ffffff;
  --ink:         #1a2e1c;
  --text-main:   #1a2b20;
  --text-muted:  #4a7055;
  --text-soft:   #7a9a80;
  --border:      rgba(44,88,48,0.14);
  --shadow-sm:   0 1px 4px rgba(22,45,26,0.08),0 2px 8px rgba(22,45,26,0.05);
  --shadow-md:   0 4px 20px rgba(22,45,26,0.12),0 2px 8px rgba(22,45,26,0.07);
  --shadow-lg:   0 12px 50px rgba(22,45,26,0.22),0 4px 16px rgba(22,45,26,0.12);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height:100%; width:100%;
  font-family:'Inter', sans-serif;
  background:#7ab58a;
  overflow:hidden;
}

body::before {
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 45%,
    rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 55%, transparent 100%);
}

.wm-left {
  position:fixed; top:0; left:0; bottom:0; z-index:0; width:40vw; pointer-events:none;
  background:url('https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=700&q=60') center/cover no-repeat;
  filter:saturate(0.10) brightness(0.52) contrast(1.12); opacity:0.28;
  mask-image:linear-gradient(to right,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.45) 55%,transparent 100%);
  -webkit-mask-image:linear-gradient(to right,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.45) 55%,transparent 100%);
}
.wm-right {
  position:fixed; top:0; right:0; bottom:0; z-index:0; width:40vw; pointer-events:none;
  background:url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=700&q=60') center/cover no-repeat;
  filter:saturate(0.10) brightness(0.52) contrast(1.12); opacity:0.26;
  mask-image:linear-gradient(to left,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.45) 55%,transparent 100%);
  -webkit-mask-image:linear-gradient(to left,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.45) 55%,transparent 100%);
}
.bg-hatch {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 34px,rgba(255,255,255,0.03) 34px,rgba(255,255,255,0.03) 35px),
    repeating-linear-gradient(90deg,transparent,transparent 34px,rgba(255,255,255,0.03) 34px,rgba(255,255,255,0.03) 35px);
}
.top-stripe { position:fixed; top:0; left:0; right:0; z-index:300; height:5px; background:var(--green-dark); }
.bot-strip  { position:fixed; bottom:0; left:0; right:0; z-index:300; height:4px;
  background:linear-gradient(90deg,var(--yellow2),var(--yellow),var(--green-mid),var(--green-dark)); }

.page-center {
  position:relative; z-index:10;
  height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}

.card {
  width:100%; max-width:460px;
  background:var(--white);
  border-top:5px solid var(--green-dark);
  border-left:1px solid rgba(144,191,144,0.20);
  border-right:1px solid rgba(144,191,144,0.20);
  border-bottom:1px solid rgba(144,191,144,0.20);
  box-shadow:var(--shadow-lg);
  padding:36px 36px 28px;
  position:relative; overflow:hidden;
}
.card::before {
  content:"";
  position:absolute; left:0; top:0; bottom:0;
  width:4px; background:var(--yellow);
}

.card-header { margin-bottom:28px; }
.card-eyebrow {
  font-family:'Plus Jakarta Sans', sans-serif;
  font-size:9px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
  color:var(--text-soft); margin-bottom:4px;
}
.card-title {
  font-family:'Plus Jakarta Sans', sans-serif;
  font-size:24px; font-weight:800; color:var(--green-dark);
  letter-spacing:-0.3px; line-height:1.1;
  display:flex; align-items:center; gap:10px;
}
.card-title-icon {
  display:inline-flex; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:6px;
  background:var(--green-light);
  border:1.5px solid rgba(44,88,48,0.15);
  font-size:18px; flex-shrink:0;
}

.card-divider {
  height:1.5px; background:var(--green-light);
  margin:0 0 24px;
}

.field-group { margin-bottom:16px; }
.field-label {
  display:block;
  font-family:'Plus Jakarta Sans', sans-serif;
  font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
  color:var(--text-muted); margin-bottom:7px;
}

.input-wrapper { position:relative; }

input {
  width:100%;
  padding:13px 48px 13px 16px;
  background:var(--green-pale);
  border:1.5px solid var(--border);
  border-radius:4px;
  font-family:'Inter', sans-serif;
  font-size:14px; font-weight:500; color:var(--text-main);
  outline:none;
  transition:all .18s ease;
}
input::placeholder { color:var(--text-soft); font-weight:400; }
input:focus {
  background:var(--white);
  border-color:var(--green-dark);
  box-shadow:0 0 0 3px rgba(44,88,48,0.10), var(--shadow-sm);
}

.eye {
  position:absolute; right:14px; top:50%;
  transform:translateY(-50%);
  font-size:18px; cursor:pointer; color:var(--text-soft);
  line-height:1; user-select:none;
  transition:color .15s;
}
.eye:hover { color:var(--green-dark); }

.btn-group { margin-top:24px; display:flex; flex-direction:column; gap:10px; }

.btn-main {
  width:100%; padding:14px;
  font-family:'Plus Jakarta Sans', sans-serif;
  font-size:13px; font-weight:800; letter-spacing:0.5px;
  background:var(--green-dark); color:var(--white);
  border:none; cursor:pointer; border-radius:4px;
  transition:all .20s ease;
  box-shadow:3px 3px 0 rgba(0,0,0,0.20);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-main:hover {
  background:var(--green-mid);
  transform:translate(-2px,-2px);
  box-shadow:5px 5px 0 rgba(0,0,0,0.22);
}
.btn-main:active { transform:translate(0,0); box-shadow:2px 2px 0 rgba(0,0,0,0.18); }
.btn-main:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

.btn-back {
  width:100%; padding:13px;
  font-family:'Plus Jakarta Sans', sans-serif;
  font-size:12px; font-weight:700; letter-spacing:0.5px;
  background:transparent; color:var(--text-muted);
  border:1.5px solid rgba(44,88,48,0.22);
  cursor:pointer; border-radius:4px;
  transition:all .20s ease;
}
.btn-back:hover {
  background:var(--green-dark); color:var(--white);
  border-color:var(--green-dark);
  transform:translateX(-2px);
  box-shadow:3px 0 0 rgba(0,0,0,0.15);
}
.btn-back:active { transform:translate(0,0); }

.hint {
  margin-top:6px;
  font-size:11px; font-weight:500;
  color:var(--text-soft);
  font-family:'Inter', sans-serif;
  display:flex; align-items:center; gap:4px;
}

.popup {
  position:fixed; top:-120px; left:50%;
  transform:translateX(-50%);
  padding:14px 22px;
  background:var(--white);
  border-radius:0;
  font-family:'Plus Jakarta Sans', sans-serif;
  font-size:13px; font-weight:700;
  box-shadow:var(--shadow-lg);
  opacity:0; transition:0.40s cubic-bezier(.16,1,.3,1);
  white-space:nowrap; z-index:1000;
  display:flex; align-items:center; gap:10px;
}
.popup.show { top:36px; opacity:1; }
.popup.success { border-left:5px solid #059669; color:#1a4a2e; }
.popup.error   { border-left:5px solid #dc2626; color:#4a1a1a; }

@media(max-width:520px) {
  .card { padding:28px 22px 22px; }
  .card-title { font-size:20px; }
  .wm-left,.wm-right { width:55vw; }
}
</style>
</head>

<body>

<div class="wm-left"></div>
<div class="wm-right"></div>
<div class="bg-hatch"></div>
<div class="top-stripe"></div>
<div class="bot-strip"></div>

<div id="popup" class="popup"></div>

<div class="page-center">
  <div class="card">

    <div class="card-header">
      <div class="card-eyebrow">Bookit</div>
      <div class="card-title">
        <span class="card-title-icon">🔒</span>
        Change Password
      </div>
    </div>

    <div class="card-divider"></div>

    <div class="field-group">
      <label class="field-label">Current Password</label>
      <div class="input-wrapper">
        <input type="password" id="currentPass" placeholder="Enter current password">
        <span class="eye" onclick="toggleEye('currentPass', this)">👁️</span>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">New Password</label>
      <div class="input-wrapper">
        <input type="password" id="newPass" placeholder="Enter new password">
        <span class="eye" onclick="toggleEye('newPass', this)">👁️</span>
      </div>
      <div class="hint">⚠ Must include A-Z, a-z, number &amp; special character</div>
    </div>

    <div class="field-group">
      <label class="field-label">Confirm New Password</label>
      <div class="input-wrapper">
        <input type="password" id="confirmPass" placeholder="Re-enter new password">
        <span class="eye" onclick="toggleEye('confirmPass', this)">👁️</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-main" id="updateBtn" onclick="changePassword()">🔐 Update Password</button>
      <button class="btn-back" onclick="location.href='profile.html'">← Back to Profile</button>
    </div>

  </div>
</div>

<script>

function toggleEye(id, icon) {
    const field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

function showPopup(msg, type) {
    const p = document.getElementById("popup");
    p.textContent = msg;
    p.className = "popup " + type + " show";
    setTimeout(() => p.classList.remove("show"), 2500);
}

function isStrongPassword(p) {
    return /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&]).{6,}$/.test(p);
}

async function changePassword() {

    const user = auth.currentUser;
    if (!user) return showPopup("Not logged in!", "error");

    const email   = user.email;
    const current = currentPass.value;
    const newP    = newPass.value;
    const confirm = confirmPass.value;

    if (!current || !newP || !confirm)
        return showPopup("All fields required!", "error");

    if (newP !== confirm)
        return showPopup("Passwords do not match!", "error");

    if (!isStrongPassword(newP))
        return showPopup("Weak password! Use A-Z, a-z, number & symbol.", "error");

    // Disable button while working
    const btn = document.getElementById("updateBtn");
    btn.disabled = true;
    btn.textContent = "Updating…";

    try {
        const credential = EmailAuthProvider.credential(email, current);
        await reauthenticateWithCredential(user, credential);
    } catch (e) {
        console.error("Reauth error:", e);
        btn.disabled = false;
        btn.innerHTML = "🔐 Update Password";
        return showPopup("Incorrect current password!", "error");
    }

    try {
        // 1️⃣ Update the password in Firebase Auth
        await updatePassword(user, newP);

        // 2️⃣ ✅ Flip mustChangePassword → false in Firestore
        await firestoreUpdateDoc(firestoreDoc(db, "users", user.uid), {
            mustChangePassword: false
        });

        showPopup("✅ Password updated successfully!", "success");

        currentPass.value = "";
        newPass.value     = "";
        confirmPass.value = "";

        // 3️⃣ ✅ Role-based redirect — sessionStorage first, Firestore as fallback
        let role = sessionStorage.getItem("userRole");
        if (!role) {
            const snap = await firestoreGetDoc(firestoreDoc(db, "users", user.uid));
            role = snap.exists() ? snap.data().role : "user";
        }
        setTimeout(() => {
            location.href = (role === "admin") ? "admin-dashboard.html" : "user.html";
        }, 1800);

    } catch (e) {
        console.error("Update error:", e);
        showPopup("Error updating password!", "error");
    } finally {
        btn.disabled = false;
        btn.innerHTML = "🔐 Update Password";
    }
}

</script>

</body>
</html>
